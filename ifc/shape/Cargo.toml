[package]
name = "ifc-shape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The ONLY bridge between IFC and geometry. Depends on kernel traits, never a backend."

[dependencies]
ifc-schema.workspace = true
ifc-model.workspace = true
# Data types and the CONTRACT only.
geom-core.workspace = true
geom-kernel.workspace = true
# NOTE: geom-cpu / geom-simd / geom-gpu / geom-dispatch MUST NOT appear here.
# Depending on a concrete backend would weld this workspace to one geometry
# implementation and break the swap requirement. Enforced by a test in
# tests/no_backend_dependency.rs.
