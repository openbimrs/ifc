[package]
name = "openbim-ifc-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "WebAssembly bindings for openbim-ifc: read, edit and write IFC STEP files from JavaScript."
keywords = ["ifc", "bim", "wasm", "step", "openbim"]
categories = ["wasm", "parser-implementations"]

[lib]
# `cdylib` is the wasm module; `rlib` lets the native tests exercise the
# value codec without a JS host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ADR 0013: a binding depends on the facade only, never on an ifc-* crate.
openbim-ifc = { workspace = true, default-features = false, features = ["step", "schema"] }
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[lints]
workspace = true
