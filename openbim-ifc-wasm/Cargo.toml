[package]
name = "openbim-ifc-wasm"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "WebAssembly bindings for openbim-ifc: read, edit and write IFC STEP files from JavaScript."
keywords = ["ifc", "bim", "wasm", "step", "openbim"]
categories = ["wasm", "parser-implementations"]
# npm-only: distributed as `@openbim/ifc`. On crates.io it would also need
# openbim-ifc-binding-core published, for a crate nobody depends on in Rust.
publish = false

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# Published to npm; a tested browser/bundler build and domain views are
# still open.
status = "partial"
# core | domain | geometry | facade | binding
group = "binding"

[lib]
# The wasm module. Native builds compile an empty crate: every operation and
# its tests live in openbim-ifc-binding-core.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ADR 0013: bindings reach IFC through the facade only; the shared binding
# core is itself a facade-only crate.
openbim-ifc-binding-core.workspace = true
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[lints]
workspace = true
