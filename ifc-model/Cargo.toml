[package]
name = "ifc-model"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "The IFC entity graph: storage and structural queries, free of domain semantics and serialization."

[features]
# Coverage-audit hook: records which entity types are actually built.
# Off by default, and inert unless AUTHORED_DUMP is also set, so an
# --all-features build pays one relaxed atomic load per entity.
# See src/authored_dump.rs and scripts/authored-coverage.py.
authored-dump = []

[dependencies]
# NOTE: deliberately NO codec dependency. The model must not know about STEP,
# ifcXML, or any other serialization -- codecs depend on the model, not the
# reverse. Enforced by ifc/tests/thin_build.rs. See docs/adr/0006.
#
# NO geometry dependency either: semantics are not shapes.
ahash.workspace = true
thiserror.workspace = true

[dev-dependencies]
cargo_metadata = "0.19"
syn = { version = "2", features = ["full", "parsing"] }

# Hash seeding differs by target (#34). Natively, ahash seeds from OS
# randomness (getrandom). getrandom 0.3 does not build for browser WASM
# (wasm32-unknown-unknown) without a global cfg flag every consumer would
# have to set, so there the seed is fixed at build time instead. These maps
# are internal lookup tables over data the caller already controls, so a
# per-build seed on the web costs no meaningful HashDoS resistance.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
ahash = { workspace = true, features = ["runtime-rng"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ahash = { workspace = true, features = ["compile-time-rng"] }

[lints]
workspace = true
