[package]
name = "openbim-ifc-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Python bindings for openbim-ifc: read, edit and write IFC STEP files from Python."
keywords = ["ifc", "bim", "python", "step", "openbim"]
categories = ["api-bindings", "parser-implementations"]
# Shipped as a wheel (maturin), not as a crate: publishing to crates.io would
# offer a Python extension to Rust users who cannot use it.
publish = false

[lib]
# The extension module Python imports as `openbim_ifc._native`; `rlib` lets
# the Rust tests link the binding code without an interpreter.
name = "openbim_ifc_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ADR 0013: bindings reach the facade only through the shared binding core.
openbim-ifc-binding-core.workspace = true
# abi3-py39: one wheel for CPython 3.9+. No `extension-module` feature: it is
# deprecated in pyo3 0.29; maturin sets PYO3_BUILD_EXTENSION_MODULE instead,
# and leaving it off keeps `cargo test --workspace` linkable.
pyo3 = { version = "=0.29.2", features = ["abi3-py39"] }
# Opt-in pure-Rust allocator, see the `rusty_alloc` feature (#49). Pinned
# exactly, core crate included: an allocator is unsafe code under every
# allocation, and this one is young (its 0.3.x line had use-after-frees), so
# an upgrade is a reviewed, measured change, never a silent `cargo update`.
rusty_alloc-api = { version = "=2.2.1", optional = true }
rusty_alloc = { version = "=2.2.1", optional = true, default-features = false }

[features]
default = []
# Route this extension's Rust allocations through rusty_alloc: reading
# STEP into a model takes 18-35% less CPU time on seven real IFC files, at
# 1-7% less peak memory (measured in #49). Build the wheel with
# `maturin build --release --features rusty_alloc`.
rusty_alloc = ["dep:rusty_alloc-api", "dep:rusty_alloc"]

[lints]
workspace = true
