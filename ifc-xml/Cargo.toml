[package]
name = "ifc-xml"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "ifcXML (ISO 10303-28) codec for the IFC model."

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
status = "implemented"
# core | domain | geometry | facade | binding
group = "core"

[dependencies]
ifc-model.workspace = true
# Optional: without a schema the codec still round-trips, using positional
# fallback names. With one, it emits conformant named attributes.
ifc-schema = { workspace = true, optional = true }
quick-xml.workspace = true
thiserror.workspace = true

[dev-dependencies]
ifc-step.workspace = true

[features]
default = ["schema"]
# Emit/read schema-correct attribute NAMES rather than positional fallbacks.
schema = ["dep:ifc-schema"]

[lints]
workspace = true
