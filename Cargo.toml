[workspace]
resolver = "2"
members = ["ifc-*", "openbim-ifc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"

# Every public item carries a doc comment. Crates that already satisfy this
# opt in with `[lints] workspace = true`; the rest are listed in
# scripts/check-missing-docs.py with their current debt, which that script
# ratchets downward. A crate reaching zero should be moved onto this lint and
# removed from the script's budget, which is then enforced permanently.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
# IFC family: versioned path dependencies build standalone and normalize to
# registry dependencies when packages are published.
ifc-schema = { path = "ifc-schema", version = "0.1.0" }
openbim-ifc = { path = "openbim-ifc", version = "0.1.0" }
ifc-step = { path = "ifc-step", version = "0.1.0" }
ifc-xml = { path = "ifc-xml", version = "0.1.0" }
ifc-model = { path = "ifc-model", version = "0.1.0" }
ifc-geometry = { path = "ifc-geometry", version = "0.1.0", default-features = false }
ifc-properties = { path = "ifc-properties", version = "0.1.0" }
ifc-template-catalog = { path = "ifc-template-catalog", version = "0.1.0" }
ifc-cost = { path = "ifc-cost", version = "0.1.0" }
ifc-schedule = { path = "ifc-schedule", version = "0.1.0" }
ifc-material = { path = "ifc-material", version = "0.1.0" }
ifc-style = { path = "ifc-style", version = "0.1.0" }
ifc-element-type = { path = "ifc-element-type", version = "0.1.0" }
ifc-structural = { path = "ifc-structural", version = "0.1.0" }
ifc-resource = { path = "ifc-resource", version = "0.1.0" }
ifc-classification = { path = "ifc-classification", version = "0.1.0" }
ifc-approval = { path = "ifc-approval", version = "0.1.0" }
ifc-constraint = { path = "ifc-constraint", version = "0.1.0" }
ifc-georef = { path = "ifc-georef", version = "0.1.0" }
ifc-systems = { path = "ifc-systems", version = "0.1.0" }
ifc-alignment = { path = "ifc-alignment", version = "0.1.0" }
ifc-validate = { path = "ifc-validate", version = "0.1.0" }
ifc-author = { path = "ifc-author", version = "0.1.0" }
ifc-spatial = { path = "ifc-spatial", version = "0.1.0" }
openbim-step = "=0.5.0"

# Format-neutral geometry contracts. IFC bridges select representations, never
# concrete CPU/GPU execution providers.
axiolid-core = { version = "0.2.1" }
axiolid-mesh = { version = "0.2.1" }
axiolid-model = { version = "0.2.1" }
axiolid-primitive = { version = "0.2.1" }
axiolid-profile = { version = "0.2.1" }
axiolid-surface = { version = "0.2.1" }
axiolid-reference = { version = "0.2.1" }
axiolid-curve = { version = "0.2.1" }
axiolid-evaluate = { version = "0.2.1" }
axiolid-curve-evaluate-contract = { version = "0.2.1" }
axiolid-topology = { version = "0.2.1" }
# Execution provider. Only ifc-geometry's opt-in `compile` feature may use
# these; the default dependency graph stays representation-only (ADR 0004).
axiolid-contracts = { version = "0.2.1" }
axiolid-mesh-compile = { version = "0.2.1" }
axiolid-mesh-compile-contract = { version = "0.2.1" }
axiolid-mesh-boolean-boolmesh = { version = "0.2.1" }

ahash = "0.8"
thiserror = "2.0"
rayon = "1.10"
memmap2 = "0.9"
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
