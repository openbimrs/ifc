[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"

# Every public item carries a doc comment. Crates that already satisfy this
# opt in with `[lints] workspace = true`; the rest are listed in
# scripts/check-missing-docs.py with their current debt, which that script
# ratchets downward. A crate reaching zero should be moved onto this lint and
# removed from the script's budget, which is then enforced permanently.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
# IFC family: versioned path dependencies build standalone and normalize to
# registry dependencies when packages are published.
ifc-schema = { path = "crates/ifc-schema", version = "0.2.2" }
openbim-ifc = { path = "crates/openbim-ifc", version = "0.8.0", default-features = false }
openbim-ifc-binding-core = { path = "crates/openbim-ifc-binding-core", version = "0.1.0" }
ifc-step = { path = "crates/ifc-step", version = "0.3.0" }
ifc-xml = { path = "crates/ifc-xml", version = "0.2.1" }
ifc-model = { path = "crates/ifc-model", version = "0.2.3" }
ifc-geometry = { path = "crates/ifc-geometry", version = "0.4.3", default-features = false }
ifc-properties = { path = "crates/ifc-properties", version = "0.5.0" }
ifc-template-catalog = { path = "crates/ifc-template-catalog", version = "0.2.1" }
ifc-cost = { path = "crates/ifc-cost", version = "0.2.1" }
ifc-schedule = { path = "crates/ifc-schedule", version = "0.2.0" }
ifc-material = { path = "crates/ifc-material", version = "0.3.0" }
ifc-style = { path = "crates/ifc-style", version = "0.3.0" }
ifc-element-type = { path = "crates/ifc-element-type", version = "0.2.0" }
ifc-occurrence = { path = "crates/ifc-occurrence", version = "0.2.0" }
ifc-structural = { path = "crates/ifc-structural", version = "0.2.0" }
ifc-resource = { path = "crates/ifc-resource", version = "0.2.0" }
ifc-classification = { path = "crates/ifc-classification", version = "0.2.0" }
ifc-approval = { path = "crates/ifc-approval", version = "0.2.0" }
ifc-control = { path = "crates/ifc-control", version = "0.2.1" }
ifc-tabular = { path = "crates/ifc-tabular", version = "0.2.1" }
ifc-constraint = { path = "crates/ifc-constraint", version = "0.2.0" }
ifc-georef = { path = "crates/ifc-georef", version = "0.3.0" }
ifc-systems = { path = "crates/ifc-systems", version = "0.2.0" }
ifc-alignment = { path = "crates/ifc-alignment", version = "0.3.1" }
ifc-validate = { path = "crates/ifc-validate", version = "0.3.0" }
ifc-author = { path = "crates/ifc-author", version = "0.2.1" }
ifc-spatial = { path = "crates/ifc-spatial", version = "0.2.3" }
openbim-step = "=0.8.0"

# Format-neutral geometry contracts. IFC bridges select representations, never
# concrete CPU/GPU execution providers.
axiolid-core = { version = "0.3.0" }
axiolid-mesh = { version = "0.3.0" }
axiolid-model = { version = "0.3.0" }
axiolid-primitive = { version = "0.3.0" }
axiolid-profile = { version = "0.3.0" }
axiolid-surface = { version = "0.3.0" }
axiolid-reference = { version = "0.3.0" }
# Dev-only: the worked example indexing product bounds (#36). The index is
# Axiolid's; this repository only produces the boxes it consumes.
axiolid-spatial = { version = "0.3.0" }
axiolid-curve = { version = "0.3.0" }
axiolid-evaluate = { version = "0.3.1" }
axiolid-curve-evaluate-contract = { version = "0.3.0" }
axiolid-topology = { version = "0.3.0" }
# Execution provider. Only ifc-geometry's opt-in `compile` feature may use
# these; the default dependency graph stays representation-only (ADR 0004).
axiolid-contracts = { version = "0.3.1" }
axiolid-mesh-compile = { version = "0.3.4" }
axiolid-mesh-compile-contract = { version = "0.3.1" }
axiolid-mesh-boolean-boolmesh = { version = "0.3.0" }
# Not used directly: `axiolid-mesh-compile` reaches it. Pinned here only to
# raise the floor to 0.3.2, whose fixes the compiled results depend on
# (axiolid/kernel#164 half-space frame origin, #166 downward extrusion,
# #169 swept-disk frame along a bent path).
axiolid-construct = { version = "0.3.3" }

# No default features: the default `runtime-rng` pulls getrandom 0.3, which
# does not build on wasm32-unknown-unknown. Members opt into a seed source
# per target (runtime randomness natively, a build-time seed on the web);
# see crates/ifc-model/Cargo.toml and #34.
ahash = { version = "0.8", default-features = false, features = ["std"] }
thiserror = "2.0"
rayon = "1.10"
memmap2 = "0.9"
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
