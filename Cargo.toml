[workspace]
resolver = "2"
members = [
    "packages/ifc/*",
    "packages/openbim/*",
    "bindings/python",
    "apps/*",
]

# `bindings/_deferred-wasm/` is intentionally NOT a member. WASM is deferred
# (see bindings/AGENTS.md); the underscore prefix keeps it out of any future
# `bindings/*` glob as well, so re-adding it is a deliberate act.
exclude = ["bindings/_deferred-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]

[workspace.dependencies]
# --- ../axiolid: format-agnostic geometry. Knows nothing about IFC. ---
# `axiolid` is the opt-in facade. Leaf crates remain independently consumable.
axiolid = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079", default-features = false }
axiolid-core = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-mesh = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-model = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-primitive = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-heal = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-profile = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-curve = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-surface = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-sweep = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-topology = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-tessellate = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-spatial = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-measure = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
# The scalar reference implementation and correctness oracle (ADR 0012).
axiolid-scalar = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
axiolid-compile = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }
# Contract and implementations are separate crates so feature unification can
# never pull a concrete backend into a format adapter.
axiolid-kernel = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079", default-features = false }
axiolid-backend-cpu = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079", default-features = false }
axiolid-backend-gpu = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079", default-features = false }
# boolmesh-backed provider (ADR 0014). Isolated so `boolmesh` never enters
# axiolid-kernel's graph; the contract crate stays implementation-free.
axiolid-boolmesh = { git = "https://github.com/axiolid/axiolid-kernel.git", rev = "9e76a1452907f8c5e81901f94abed31d90393079" }

# --- packages/ifc: pure IFC. Only ifc-geometry may touch the geometry kernel. ---
ifc-schema = { path = "packages/ifc/ifc-schema" }
ifc-migrate = { path = "packages/ifc/ifc-migrate" }
ifc-infer = { path = "packages/ifc/ifc-infer" }
ifc = { path = "packages/ifc/ifc" }
ifc-step = { path = "packages/ifc/ifc-step" }
ifc-xml = { path = "packages/ifc/ifc-xml" }
ifc-model = { path = "packages/ifc/ifc-model" }
ifc-geometry = { path = "packages/ifc/ifc-geometry" }
ifc-properties = { path = "packages/ifc/ifc-properties" }
ifc-template-catalog = { path = "packages/ifc/ifc-template-catalog" }
ifc-cost = { path = "packages/ifc/ifc-cost" }
ifc-schedule = { path = "packages/ifc/ifc-schedule" }
ifc-material = { path = "packages/ifc/ifc-material" }
ifc-style = { path = "packages/ifc/ifc-style" }
ifc-structural = { path = "packages/ifc/ifc-structural" }
ifc-resource = { path = "packages/ifc/ifc-resource" }
ifc-classification = { path = "packages/ifc/ifc-classification" }
ifc-georef = { path = "packages/ifc/ifc-georef" }
ifc-systems = { path = "packages/ifc/ifc-systems" }
ifc-alignment = { path = "packages/ifc/ifc-alignment" }
ifc-validate = { path = "packages/ifc/ifc-validate" }

# --- packages/openbim: standards built ON the IFC layer, never inside it. ---
ids = { path = "packages/openbim/ids" }
bcf = { path = "packages/openbim/bcf" }
clash = { path = "packages/openbim/clash" }
diff = { path = "packages/openbim/diff" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. See docs/adr/0003.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
