[workspace]
resolver = "2"
members = ["geom/*", "ifc/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]

[workspace.dependencies]
# --- geom/ : the shared geometry kernel (swappable, hardware-abstracted) ---
geom-core = { path = "geom/core" }
geom-kernel = { path = "geom/kernel" }
geom-cpu = { path = "geom/cpu" }
geom-simd = { path = "geom/simd" }
geom-gpu = { path = "geom/gpu" }
geom-dispatch = { path = "geom/dispatch" }

# --- ifc/ : pure IFC logic (depends on geom-kernel traits ONLY, never a backend) ---
ifc-schema = { path = "ifc/schema" }
ifc-parser = { path = "ifc/parser" }
ifc-model = { path = "ifc/model" }
ifc-shape = { path = "ifc/shape" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. The f64 (D*) types are
# what we store; see docs/adr/0002.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
