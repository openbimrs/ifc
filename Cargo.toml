[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"

# Every public item carries a doc comment. Crates that already satisfy this
# opt in with `[lints] workspace = true`; the rest are listed in
# scripts/check-missing-docs.py with their current debt, which that script
# ratchets downward. A crate reaching zero should be moved onto this lint and
# removed from the script's budget, which is then enforced permanently.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
# IFC family: versioned path dependencies build standalone and normalize to
# registry dependencies when packages are published.
# default-features = false: the facade and the bindings pick releases one by
# one (#112); a member that needs every bundled table asks for `default`.
# The crates the bindings reach (validate, spatial, geometry, properties,
# classification, material, systems, cost, georef) do the same (#306):
# their release features forward to ifc-schema's, and the facade chooses.
ifc-schema = { path = "crates/ifc-schema", version = "0.3.2", default-features = false }
openbim-ifc = { path = "crates/openbim-ifc", version = "0.27.0", default-features = false }
openbim-ifc-binding-core = { path = "crates/openbim-ifc-binding-core", version = "0.1.0", default-features = false }
ifc-step = { path = "crates/ifc-step", version = "0.5.0" }
ifc-xml = { path = "crates/ifc-xml", version = "0.4.0" }
ifc-model = { path = "crates/ifc-model", version = "0.3.0" }
ifc-geometry = { path = "crates/ifc-geometry", version = "0.21.0", default-features = false }
ifc-properties = { path = "crates/ifc-properties", version = "0.8.1", default-features = false }
ifc-template-catalog = { path = "crates/ifc-template-catalog", version = "0.4.0", default-features = false }
ifc-cost = { path = "crates/ifc-cost", version = "0.4.0", default-features = false }
ifc-schedule = { path = "crates/ifc-schedule", version = "0.4.0" }
ifc-material = { path = "crates/ifc-material", version = "0.5.0", default-features = false }
ifc-style = { path = "crates/ifc-style", version = "0.4.0" }
ifc-element-type = { path = "crates/ifc-element-type", version = "0.3.0" }
ifc-occurrence = { path = "crates/ifc-occurrence", version = "0.3.0" }
ifc-structural = { path = "crates/ifc-structural", version = "0.4.0" }
ifc-resource = { path = "crates/ifc-resource", version = "0.4.0" }
ifc-classification = { path = "crates/ifc-classification", version = "0.4.0", default-features = false }
ifc-approval = { path = "crates/ifc-approval", version = "0.3.0" }
ifc-control = { path = "crates/ifc-control", version = "0.3.0" }
ifc-tabular = { path = "crates/ifc-tabular", version = "0.3.0" }
ifc-constraint = { path = "crates/ifc-constraint", version = "0.3.0" }
ifc-georef = { path = "crates/ifc-georef", version = "0.6.0", default-features = false }
ifc-systems = { path = "crates/ifc-systems", version = "0.4.0", default-features = false }
ifc-alignment = { path = "crates/ifc-alignment", version = "0.8.0" }
ifc-validate = { path = "crates/ifc-validate", version = "0.6.0", default-features = false }
ifc-author = { path = "crates/ifc-author", version = "0.3.0" }
ifc-spatial = { path = "crates/ifc-spatial", version = "0.5.0", default-features = false }
openbim-step = "=0.11.0"

# Format-neutral geometry contracts. IFC bridges select representations, never
# concrete CPU/GPU execution providers.
axiolid-core = { version = "0.3.0" }
axiolid-mesh = { version = "0.3.0" }
# 0.3.6: station seam sides (`SeamSide`, axiolid/kernel#263; #346). 0.3.7: a
# bounded half-space's boundary may be a `Profile` contour of lines and
# circular arcs (axiolid/kernel#277, Axiolid ADR 0084; #398), and stations
# run along curve relations (axiolid/kernel#285; #346). 0.3.8: the versioned
# wire format of a `GeometryGraph` behind its `serde` feature, JSON and CBOR
# (axiolid/kernel#267, Axiolid ADR 0085; #367); `ifc-geometry`'s `wire`
# feature turns it on. It requires the 0.3.x releases of the representation
# crates that carry their own `serde` features (core 0.3.2, curve 0.3.7,
# mesh 0.3.3, primitive 0.3.3, profile 0.3.2, surface 0.3.3, topology 0.3.2).
# 0.3.9: `OrientedCurveStation::with_seam_window`, the kernel snapping a
# station onto a seam within a stated window (axiolid/kernel#294; #423);
# wire format 1.1 carries it, and writes 1.0 where no station has one.
axiolid-model = { version = "0.3.9" }
axiolid-primitive = { version = "0.3.0" }
axiolid-profile = { version = "0.3.0" }
axiolid-surface = { version = "0.3.0" }
axiolid-reference = { version = "0.3.6" }
# Dev-only: the worked example indexing product bounds (#36). The index is
# Axiolid's; this repository only produces the boxes it consumes.
axiolid-spatial = { version = "0.3.0" }
# 0.3.3 of the contract (with axiolid-curve 0.3.5 and axiolid-evaluate
# 0.3.9): `CurveEvaluator::frame_at_on` and its siblings read the side of a
# seam a measure lies on, and the reference provider answers both sides
# (axiolid/kernel#286); a derived linear placement on a seam reads the
# incoming side (#409). kernel#242 documents `frame_at` as x tangent, y up,
# z right. 0.3.4 (with axiolid-curve 0.3.6 and axiolid-evaluate 0.3.10)
# reads a curve relation as a neutral `CurvePath` through the `path_*`
# queries (axiolid/kernel#290); a derived linear placement on a composite or
# trimmed basis reads it (#418). The same releases measure stations along
# offsets, `PathCurve::Offset` and `StationOffset` (axiolid/kernel#289;
# #414). 0.3.5 of the contract (with axiolid-evaluate 0.3.11):
# `CurveEvaluator::path_joint_distances`, a path's joints certified to a
# stated tolerance, for offsets whose length is a quadrature
# (axiolid/kernel#294; #423).
axiolid-curve = { version = "0.3.6" }
axiolid-evaluate = { version = "0.3.11" }
axiolid-curve-evaluate-contract = { version = "0.3.5" }
# Dev-only: the exact volume of a compiled body, to check an arc-bounded
# half-space clip against its closed form (#398).
axiolid-measure = { version = "0.3.10" }
axiolid-topology = { version = "0.3.0" }
# Execution provider. Only ifc-geometry's opt-in `compile` feature may use
# these; the default dependency graph stays representation-only (ADR 0004).
axiolid-contracts = { version = "0.3.1" }
# 0.3.12 resolves `TrimSelector::ArcLength` (the CUBIC transition, #90) and
# mitres a sharp swept-disk polyline corner exactly; 0.3.9 to 0.3.11 refused
# that corner (axiolid/kernel#245, #315). 0.3.13 resolves stations and meshes
# the station-placed sections and offset curves (axiolid/kernel#241, #246;
# #307), and compiles `IfcCurveBoundedPlane` boundaries that lower to a
# `CurveRelation::Composite` or `Trimmed` (axiolid/kernel#255; #336).
# 0.3.15 reads a station on a seam from the side it names and mitres runs of
# sections and offsets across seams (axiolid/kernel#263; #346). 0.3.16
# compiles a bounded half-space whose boundary is a line-and-arc `Profile`
# contour, with a certified deviation (axiolid/kernel#277; #398), and
# resolves stations along curve relations (axiolid/kernel#285; #346).
# 0.3.17 is the release built with the wave-2 curve and evaluate crates
# (axiolid/kernel#286). 0.3.19 is the release built with the wave-3 curve
# and evaluate crates, and flattens a relation into a `CurvePath`
# (`station::curve_path`, axiolid/kernel#290; the #418 tests compare it); it
# resolves stations along offset curves, measured in the offset's own length
# (axiolid/kernel#289; #414). 0.3.20 resolves a station's seam window
# (axiolid/kernel#294; #423).
axiolid-mesh-compile = { version = "0.3.20" }
axiolid-mesh-compile-contract = { version = "0.3.3" }
axiolid-mesh-boolean-boolmesh = { version = "0.3.0" }
# Not used directly: `axiolid-mesh-compile` reaches it. Pinned here only to
# raise the floor to the release whose fixes the compiled results depend on
# (axiolid/kernel#164 half-space frame origin, #166 downward extrusion,
# #169 swept-disk frame along a bent path, #245 half-angle corner mitre),
# and to the release `axiolid-mesh-compile` 0.3.16 is built and tested
# with (0.3.17: an exact right-cylinder wall per boundary arc,
# axiolid/kernel#277; #398).
axiolid-construct = { version = "0.3.17" }

# No default features: the default `runtime-rng` pulls getrandom 0.3, which
# does not build on wasm32-unknown-unknown. Members opt into a seed source
# per target (runtime randomness natively, a build-time seed on the web);
# see crates/ifc-model/Cargo.toml and #34.
ahash = { version = "0.8", default-features = false, features = ["std"] }
thiserror = "2.0"
rayon = "1.10"
memmap2 = "0.9"
quick-xml = "0.42"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
