[workspace]
resolver = "2"
members = [
    "packages/geometry/*",
    "packages/ifc/*",
    "packages/openbim/*",
    "bindings/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]

[workspace.dependencies]
# --- packages/geometry: format-agnostic geometry. Knows nothing about IFC. ---
geom-core = { path = "packages/geometry/geom-core" }
geom-mesh = { path = "packages/geometry/geom-mesh" }
geom-brep = { path = "packages/geometry/geom-brep" }
geom-kernel = { path = "packages/geometry/geom-kernel", default-features = false }

# --- packages/ifc: pure IFC. Only ifc-geometry may touch the geometry kernel. ---
ifc-schema = { path = "packages/ifc/ifc-schema" }
ifc-step = { path = "packages/ifc/ifc-step" }
ifc-model = { path = "packages/ifc/ifc-model" }
ifc-geometry = { path = "packages/ifc/ifc-geometry" }
ifc-properties = { path = "packages/ifc/ifc-properties" }
ifc-cost = { path = "packages/ifc/ifc-cost" }
ifc-schedule = { path = "packages/ifc/ifc-schedule" }

# --- packages/openbim: standards built ON the IFC layer, never inside it. ---
ids = { path = "packages/openbim/ids" }
bcf = { path = "packages/openbim/bcf" }
clash = { path = "packages/openbim/clash" }
diff = { path = "packages/openbim/diff" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. See docs/adr/0003.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
