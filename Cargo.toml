[workspace]
resolver = "2"
members = [
    "packages/geometry/*",
    "packages/ifc/*",
    "packages/openbim/*",
    "bindings/python",
    "apps/*",
]

# `bindings/_deferred-wasm/` is intentionally NOT a member. WASM is deferred
# (see bindings/AGENTS.md); the underscore prefix keeps it out of any future
# `bindings/*` glob as well, so re-adding it is a deliberate act.
exclude = ["bindings/_deferred-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]

[workspace.dependencies]
# --- packages/geometry: format-agnostic geometry. Knows nothing about IFC. ---
geom-core = { path = "packages/geometry/geom-core" }
geom-mesh = { path = "packages/geometry/geom-mesh" }
geom-profile = { path = "packages/geometry/geom-profile" }
geom-curve = { path = "packages/geometry/geom-curve" }
geom-surface = { path = "packages/geometry/geom-surface" }
geom-sweep = { path = "packages/geometry/geom-sweep" }
geom-topology = { path = "packages/geometry/geom-topology" }
geom-tessellate = { path = "packages/geometry/geom-tessellate" }
geom-spatial = { path = "packages/geometry/geom-spatial" }
geom-measure = { path = "packages/geometry/geom-measure" }
geom-kernel = { path = "packages/geometry/geom-kernel", default-features = false }

# --- packages/ifc: pure IFC. Only ifc-geometry may touch the geometry kernel. ---
ifc-schema = { path = "packages/ifc/ifc-schema" }
ifc = { path = "packages/ifc/ifc" }
ifc-step = { path = "packages/ifc/ifc-step" }
ifc-xml = { path = "packages/ifc/ifc-xml" }
ifc-model = { path = "packages/ifc/ifc-model" }
ifc-geometry = { path = "packages/ifc/ifc-geometry" }
ifc-properties = { path = "packages/ifc/ifc-properties" }
ifc-cost = { path = "packages/ifc/ifc-cost" }
ifc-schedule = { path = "packages/ifc/ifc-schedule" }
ifc-material = { path = "packages/ifc/ifc-material" }
ifc-style = { path = "packages/ifc/ifc-style" }
ifc-structural = { path = "packages/ifc/ifc-structural" }
ifc-resource = { path = "packages/ifc/ifc-resource" }
ifc-classification = { path = "packages/ifc/ifc-classification" }
ifc-georef = { path = "packages/ifc/ifc-georef" }
ifc-systems = { path = "packages/ifc/ifc-systems" }
ifc-alignment = { path = "packages/ifc/ifc-alignment" }
ifc-validate = { path = "packages/ifc/ifc-validate" }

# --- packages/openbim: standards built ON the IFC layer, never inside it. ---
ids = { path = "packages/openbim/ids" }
bcf = { path = "packages/openbim/bcf" }
clash = { path = "packages/openbim/clash" }
diff = { path = "packages/openbim/diff" }

# --- third-party ---
# glam: SIMD-accelerated vector math, pure Rust, no C++. See docs/adr/0003.
glam = "0.29"
thiserror = "2.0"
rayon = "1.10"
smallvec = "1.13"
ahash = "0.8"
memmap2 = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
