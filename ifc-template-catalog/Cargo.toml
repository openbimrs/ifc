[package]
name = "ifc-template-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later AND CC-BY-ND-4.0"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Versioned IFC PSD/QTO catalog definitions and correction overlays"
readme = "README.md"

[dependencies]
bincode = "2.0.1"
thiserror.workspace = true
quick-xml = { workspace = true, optional = true }
ifc-schema = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true, default-features = false }

[features]
default = ["embedded"]
embedded = []
xml = ["dep:quick-xml"]
schema = ["dep:ifc-schema"]
generation = ["embedded", "xml", "dep:sha2"]

[[bin]]
name = "ifc-template-catalog-generate"
path = "tools/generate.rs"
required-features = ["generation"]
