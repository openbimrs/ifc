[package]
name = "ifc-systems"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Distribution systems, ports, and connectivity between elements."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
gaps = []
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
# No default features: the release features choose the tables (#306).
ifc-schema.workspace = true
ifc-model.workspace = true

# Tests only: the crate reads a Model, it does not parse files itself.
[dev-dependencies]
# `Schema::from_express` for tests that parse EXPRESS fixtures or the
# fetched normative schemas; production builds never link the parser.
ifc-schema = { workspace = true, features = ["default", "express"] }
ifc-step.workspace = true

[features]
default = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]
# One feature per bundled IFC release, forwarded to `ifc-schema` (#306).
# Each links that release's schema table; a release left out is refused
# with `UnsupportedSchema` where the crate binds the declared release. The
# default keeps all five, as before; a size-sensitive build (browser WASM)
# names only the releases it ships, and the `openbim-ifc` facade forwards
# its own release features here.
ifc2x3 = ["ifc-schema/ifc2x3"]
ifc4 = ["ifc-schema/ifc4"]
ifc4x1 = ["ifc-schema/ifc4x1"]
ifc4x2 = ["ifc-schema/ifc4x2"]
ifc4x3 = ["ifc-schema/ifc4x3"]

[lints]
workspace = true
