[package]
name = "ifc-element-type"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Element, resource, and process type definitions: the IfcTypeObject catalogue."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
ifc-model.workspace = true
# The declared release's table lays out each type definition (#202).
ifc-schema = { workspace = true, features = ["default"] }

[dev-dependencies]
# Test-only: release round trips are written and read back as STEP.
ifc-step.workspace = true

[lints]
workspace = true
