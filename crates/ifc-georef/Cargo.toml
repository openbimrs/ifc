[package]
name = "ifc-georef"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Georeferencing: map conversion, coordinate reference systems, site placement."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "geometry"

[features]
# The `axiolid_core::Transform3` output (`ProjectToMap::transform`,
# `compose_project_frame`) is what most consumers want, so it stays the
# default: a plain `ifc-georef = "0.4"` keeps working unchanged.
#
# Turning it off leaves every resolved parameter -- CRS metadata, units,
# eastings/northings/height, axis direction, scale and factors, true and
# grid north, operation sources, the site reference -- with no geometry
# kernel linked. That is the build a semantic adapter wants (#268);
# `tests/kernel_free_build.rs` holds the line.
default = ["transform", "ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]
transform = ["dep:axiolid-core"]
# One feature per bundled IFC release, forwarded to `ifc-schema` (#306).
# Each links that release's schema table; a release left out is refused
# with `GeorefError::UnsupportedSchema`. The
# default keeps all five, as before; a size-sensitive build (browser WASM)
# names only the releases it ships, and the `openbim-ifc` facade forwards
# its own release features here.
ifc2x3 = ["ifc-schema/ifc2x3"]
ifc4 = ["ifc-schema/ifc4"]
ifc4x1 = ["ifc-schema/ifc4x1"]
ifc4x2 = ["ifc-schema/ifc4x2"]
ifc4x3 = ["ifc-schema/ifc4x3"]

[dependencies]
# No default features: the release features choose the tables (#306).
ifc-schema.workspace = true
ifc-model.workspace = true
# Optional so a consumer that only reads georeferencing parameters links no
# geometry kernel; see the `transform` feature.
axiolid-core = { workspace = true, optional = true }

[dev-dependencies]
ifc-step = { path = "../ifc-step" }
# The slot tests compare layouts across IFC2X3, IFC4 and IFC4X3 whatever
# release features the library is built with (#306).
ifc-schema = { workspace = true, features = ["default"] }

[lints]
workspace = true
