[package]
name = "ifc-step"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "STEP physical file (ISO 10303-21) codec for the IFC model."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "core"

[dependencies]
# Depends on the MODEL, never the reverse: a codec is a client of the data
# model. See docs/adr/0006.
ifc-model.workspace = true
openbim-step.workspace = true
memmap2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Bench-only: checks each generated synthetic workload against the committed
# SHA-256 of benchmarks/generate-fixture.awk's output.
sha2 = { version = "0.11", default-features = false }

# Codec and entity-graph baselines (#14, #119). `cargo bench` measures;
# `cargo test --bench baseline` is the CI smoke run. See benchmarks/README.md.
[[bench]]
name = "baseline"
harness = false

[lints]
workspace = true
