[package]
name = "ifc-step"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "STEP physical file (ISO 10303-21) codec for the IFC model."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
status = "implemented"
# core | domain | geometry | facade | binding
group = "core"

[dependencies]
# Depends on the MODEL, never the reverse: a codec is a client of the data
# model. See docs/adr/0006.
ifc-model.workspace = true
openbim-step.workspace = true
memmap2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
