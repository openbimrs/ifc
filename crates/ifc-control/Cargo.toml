[package]
name = "ifc-control"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded IFC control semantics: permits, project orders, action requests, and performance history."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
ifc-model.workspace = true
ifc-schema = { workspace = true, features = ["default"] }
thiserror.workspace = true

[dev-dependencies]
# Test-only: release round trips write and re-read STEP.
ifc-step.workspace = true

[lints]
workspace = true
