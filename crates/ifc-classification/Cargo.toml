[package]
name = "ifc-classification"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Classification systems, document references, libraries, external references."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
ifc-model.workspace = true
ifc-schema.workspace = true
thiserror.workspace = true

# Tests only: authored records are written and re-read as STEP.
[dev-dependencies]
ifc-step.workspace = true

[lints]
workspace = true
