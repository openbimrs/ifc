[package]
name = "ifc-schedule"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC scheduling: IfcTask/IfcWorkSchedule, sequencing, 4D linkage."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
gaps = []
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
ifc-model.workspace = true
# The bundled release tables: the `*_with_owner_history` writers lay their
# records out by attribute name from the model's declared release (#202).
ifc-schema = { workspace = true, features = ["default"] }

[dev-dependencies]
# Test-only: fixtures are STEP files, and parsing them is not a production
# concern of this crate.
ifc-step.workspace = true

[lints]
workspace = true
