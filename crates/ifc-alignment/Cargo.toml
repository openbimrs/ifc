[package]
name = "ifc-alignment"
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC4x3 linear positioning: alignments, referents, linear placement, spirals."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# Transitions, cant assembly, placement and the census remain open.
status = "partial"
# core | domain | geometry | facade | binding
group = "geometry"

[dependencies]
ifc-schema = { workspace = true, features = ["default"] }
ifc-model.workspace = true
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-model.workspace = true

[dev-dependencies]
ifc-step = { path = "../ifc-step" }
# Tests only: proves the composed centreline evaluates to the right points.
# The crate itself stores exact geometry and never evaluates it.
axiolid-evaluate.workspace = true

[lints]
workspace = true

