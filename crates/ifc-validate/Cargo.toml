[package]
name = "ifc-validate"
version = "0.8.1"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Schema conformance: WHERE rules, cardinality, GUID and reference integrity."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "core"

[dependencies]
# No default features: the release features below choose the tables (#306).
ifc-schema.workspace = true
ifc-model.workspace = true

[dev-dependencies]
# `Schema::from_express` for tests that parse EXPRESS fixtures or the
# fetched normative schemas; production builds never link the parser.
ifc-schema = { workspace = true, features = ["default", "express"] }
# Test-only: the corpus is STEP on disk. Production validation takes a Model.
ifc-step.workspace = true

# The EXPRESS evaluator against the fetched normative schemas.
[[test]]
name = "express_rules"
required-features = ["express"]

[features]
default = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3", "express"]
# One feature per bundled IFC release, forwarded to `ifc-schema` (#306).
# Each links that release's schema table; `validate_declared` refuses a
# file declaring a release left out with `ValidateError::UnbundledSchema`. The default keeps all
# five, as before; a size-sensitive build (browser WASM) names only the
# releases it ships, and the `openbim-ifc` facade forwards its own release
# features here.
ifc2x3 = ["ifc-schema/ifc2x3"]
ifc4 = ["ifc-schema/ifc4"]
ifc4x1 = ["ifc-schema/ifc4x1"]
ifc4x2 = ["ifc-schema/ifc4x2"]
ifc4x3 = ["ifc-schema/ifc4x3"]
# The EXPRESS rule evaluator (`express::ExpressRules`, #461): reads a
# release's `.exp` text at run time and evaluates its WHERE rules, type
# rules, global rules and functions. Pure Rust, no dependency; a build that
# never evaluates rule text (browser WASM) can leave it out.
express = []

[lints]
workspace = true
