[package]
name = "ifc-tabular"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Structured IFC value containers indexed by position or time."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
ifc-model.workspace = true
# The caller passes the schema; production links no bundled table.
ifc-schema.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests read the bundled tables.
ifc-schema = { workspace = true, features = ["default"] }
# Test-only: the author-then-read tests round-trip through STEP text, and
# writing or parsing it is not a production concern of this crate.
ifc-step.workspace = true

[lints]
workspace = true
