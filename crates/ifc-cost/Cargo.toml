[package]
name = "ifc-cost"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Cost semantics as a borrowed view over the IFC model."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
# A domain VIEW: borrows the model, owns no storage, and is therefore optional
# at compile time without any data loss. See docs/adr/0006.
ifc-model.workspace = true
# The bundled release tables: quantity authoring lays its record out by
# attribute name from the model's declared release (#190).
ifc-schema.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Test-only: fixtures are STEP files, and parsing them is not a production
# concern of this crate.
ifc-step.workspace = true

[lints]
workspace = true
