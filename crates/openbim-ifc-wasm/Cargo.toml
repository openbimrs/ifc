[package]
name = "openbim-ifc-wasm"
version = "0.4.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "WebAssembly bindings for openbim-ifc: read, edit and write IFC STEP files from JavaScript."
keywords = ["ifc", "bim", "wasm", "step", "openbim"]
categories = ["wasm", "parser-implementations"]
# npm-only: distributed as `@openbim/ifc`. On crates.io it would also need
# openbim-ifc-binding-core published, for a crate nobody depends on in Rust.
publish = false

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "binding"

[lib]
# The wasm module. Native builds compile an empty crate: every operation and
# its tests live in openbim-ifc-binding-core.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ADR 0013: bindings reach IFC through the facade only; the shared binding
# core is itself a facade-only crate.
openbim-ifc-binding-core.workspace = true
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[features]
# Every bundled IFC release, so the published npm package reads every file
# it did before #112. A size-sensitive browser build turns defaults off and
# names the releases it ships, e.g.
# `cargo build -p openbim-ifc-wasm --no-default-features --features ifc4`;
# a file declaring any other release is then refused with
# `unsupported-schema` by the subtype query.
#
# The capabilities (#244) are default too and can be left out the same way:
# `--no-default-features --features ifc4,ifcxml` ships ifcXML but no
# validation. A left-out capability's methods remain and throw
# `feature-disabled`, so the TypeScript surface is the same in every build.
#
# The domain views (#123) are default too: the npm package carries every
# capability. Each is a feature the same way, and a build without one keeps
# its methods, which throw `feature-disabled`.
default = [
    "ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3",
    "ifcxml", "validate", "unreachable",
    "properties", "properties-write", "property-catalog-runtime",
    "spatial", "classification", "material", "systems", "cost", "georef",
    "author", "placements",
]
ifc2x3 = ["openbim-ifc-binding-core/ifc2x3"]
ifc4 = ["openbim-ifc-binding-core/ifc4"]
ifc4x1 = ["openbim-ifc-binding-core/ifc4x1"]
ifc4x2 = ["openbim-ifc-binding-core/ifc4x2"]
ifc4x3 = ["openbim-ifc-binding-core/ifc4x3"]
# The ifcXML codec, both layouts.
ifcxml = ["openbim-ifc-binding-core/ifcxml"]
# Schema validation; links only the enabled releases' tables (#306).
validate = ["openbim-ifc-binding-core/validate"]
# The viewer reachability lint; links only the enabled releases' tables.
unreachable = ["openbim-ifc-binding-core/unreachable"]
# Domain views (#123), one per facade domain.
properties = ["openbim-ifc-binding-core/properties"]
# Writing property sets (#123); a read-only build can leave it out.
properties-write = ["openbim-ifc-binding-core/properties-write"]
# The PSD/QTO catalog property edits check `Pset_` and `Qto_` sets against
# (#318). The default loads it at runtime: the module embeds none, the
# package ships one snapshot file per edition (`catalog/*.bin`), and
# `await IfcModel.loadCatalog(release)` reads one; a write to such a set
# before that throws `catalog-not-loaded`. `property-catalog` embeds every
# edition instead (+1.4 MB, +0.53 MB gzip), and `loadCatalog` is then a
# no-op. Without either, writing one throws `feature-disabled`.
property-catalog-runtime = ["openbim-ifc-binding-core/property-catalog-runtime"]
property-catalog = ["openbim-ifc-binding-core/property-catalog"]
spatial = ["openbim-ifc-binding-core/spatial"]
classification = ["openbim-ifc-binding-core/classification"]
material = ["openbim-ifc-binding-core/material"]
systems = ["openbim-ifc-binding-core/systems"]
cost = ["openbim-ifc-binding-core/cost"]
# Schema-checked entity creation (#330): `author`, `createEntity`,
# `removeWithRelationships`.
author = ["openbim-ifc-binding-core/author"]
# Geometry (#328, ADR 0021). `placements`: each product's world placement
# and selected Body, kernel-free (`productPlacements`). `mesh`: triangles
# per product through the reference backend (`productMeshes`), opt-in and
# not in the npm package, since it links an execution provider (ADR 0004);
# build it with `--features mesh`. Without it `productMeshes` throws
# `feature-disabled`.
placements = ["openbim-ifc-binding-core/placements"]
mesh = ["openbim-ifc-binding-core/mesh"]
# Implies `properties`: the project length unit scales every operation.
georef = ["openbim-ifc-binding-core/georef"]

[lints]
workspace = true
