[package]
name = "openbim-ifc-wasm"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "WebAssembly bindings for openbim-ifc: read, edit and write IFC STEP files from JavaScript."
keywords = ["ifc", "bim", "wasm", "step", "openbim"]
categories = ["wasm", "parser-implementations"]
# npm-only: distributed as `@openbim/ifc`. On crates.io it would also need
# openbim-ifc-binding-core published, for a crate nobody depends on in Rust.
publish = false

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "partial"
gaps = [123]
# core | domain | geometry | facade | binding
group = "binding"

[lib]
# The wasm module. Native builds compile an empty crate: every operation and
# its tests live in openbim-ifc-binding-core.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ADR 0013: bindings reach IFC through the facade only; the shared binding
# core is itself a facade-only crate.
openbim-ifc-binding-core.workspace = true
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[features]
# Every bundled IFC release, so the published npm package reads every file
# it did before #112. A size-sensitive browser build turns defaults off and
# names the releases it ships, e.g.
# `cargo build -p openbim-ifc-wasm --no-default-features --features ifc4`;
# a file declaring any other release is then refused with
# `unsupported-schema` by the subtype query.
#
# The capabilities (#244) are default too and can be left out the same way:
# `--no-default-features --features ifc4,ifcxml` ships ifcXML but no
# validation. A left-out capability's methods remain and throw
# `feature-disabled`, so the TypeScript surface is the same in every build.
default = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3", "ifcxml", "validate", "unreachable"]
ifc2x3 = ["openbim-ifc-binding-core/ifc2x3"]
ifc4 = ["openbim-ifc-binding-core/ifc4"]
ifc4x1 = ["openbim-ifc-binding-core/ifc4x1"]
ifc4x2 = ["openbim-ifc-binding-core/ifc4x2"]
ifc4x3 = ["openbim-ifc-binding-core/ifc4x3"]
# The ifcXML codec, both layouts.
ifcxml = ["openbim-ifc-binding-core/ifcxml"]
# Schema validation; links every release's schema table.
validate = ["openbim-ifc-binding-core/validate"]
# The viewer reachability lint; links every release's schema table.
unreachable = ["openbim-ifc-binding-core/unreachable"]

[lints]
workspace = true
