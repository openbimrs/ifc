[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "openbim-ifc"
version = "0.1.0"
description = "Read, edit and write IFC STEP files -- Python bindings for the openbim-ifc Rust crates."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[project.urls]
Repository = "https://github.com/openbimrs/ifc"

[tool.maturin]
# Mixed layout: the pure-Python package in python/openbim_ifc wraps the
# compiled extension, which lands at openbim_ifc._native.
python-source = "python"
module-name = "openbim_ifc._native"
