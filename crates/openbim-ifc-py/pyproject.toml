[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "openbim-ifc"
version = "0.14.2"
description = "Read, edit and write IFC STEP files -- Python bindings for the openbim-ifc Rust crates."
readme = "README.md"
license = "(AGPL-3.0-or-later OR LicenseRef-Commercial) AND CC-BY-ND-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/LicenseRef-Commercial.txt", "LICENSES/CC-BY-ND-4.0.txt"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
# IfcModel.to_dataframe(); imported only when a frame is built.
pandas = ["pandas>=1.5"]

[project.urls]
Repository = "https://github.com/openbimrs/ifc"

[tool.maturin]
# Mixed layout: the pure-Python package in python/openbim_ifc wraps the
# compiled extension, which lands at openbim_ifc._native.
python-source = "python"
module-name = "openbim_ifc._native"
