language = "C"
cpp_compat = true
include_guard = "OPENBIM_IFC_CAPI_V0_1_H"
pragma_once = true
usize_is_size_t = true
documentation = true
style = "type"
sort_by = "Name"
autogen_warning = "/* Generated by cbindgen from openbim-ifc-capi; do not edit. Regenerate with UPDATE_HEADER=1 cargo test -p openbim-ifc-capi --test header. */"
header = "/* openbim-ifc C ABI v0.1 -- see openbim-ifc-capi/README.md for the ownership protocol. */"

[parse]
parse_deps = false

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["OpenbimIfcValueNode", "OpenbimIfcVersion", "OpenbimIfcStatus"]
