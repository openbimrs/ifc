[package]
name = "ifc-template-catalog"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later AND CC-BY-ND-4.0"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Versioned IFC PSD/QTO catalog definitions and correction overlays"
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
bincode = "2.0.1"
thiserror.workspace = true
# Enable no quick-xml feature here that `ifc-xml` does not want: Cargo
# unifies features across the workspace, and `quick-xml/encoding` once broke
# `ifc-xml` that way.
quick-xml = { workspace = true, optional = true }
ifc-schema = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true, default-features = false }

[features]
default = ["embedded"]
# The committed container of every edition, linked into the binary
# (1.4 MB; `embedded::load_catalog`).
embedded = []
# Catalogs installed at runtime from per-edition snapshot bytes, each checked
# against its pinned SHA-256 (`runtime::install`). Builds for wasm32.
runtime = ["dep:sha2"]
xml = ["dep:quick-xml"]
schema = ["dep:ifc-schema"]
generation = ["embedded", "xml", "dep:sha2"]

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }

[[example]]
name = "export_snapshots"
required-features = ["embedded", "runtime"]

[[example]]
name = "catalog_metrics"
required-features = ["embedded"]

[[bin]]
name = "ifc-template-catalog-generate"
path = "tools/generate.rs"
required-features = ["generation"]

[lints]
workspace = true
