[package]
name = "openbim-ifc-binding-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Host-independent core shared by the openbim-ifc language bindings (WebAssembly, C ABI, Python)."
keywords = ["ifc", "bim", "ffi", "bindings", "openbim"]
categories = ["parser-implementations"]
# Internal to the bindings: the npm and PyPI packages and the C library are
# built from source, so no registry needs it. Publishing it would make this
# layer a public Rust API to keep stable.
publish = false

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "binding"

[dependencies]
# ADR 0013: bindings depend on the facade only, never on an ifc-* crate.
# `schema-api` without a release: the release features below choose the
# bundled tables (#112).
openbim-ifc = { workspace = true, default-features = false, features = ["step", "schema-api"] }

[features]
# Every bundled IFC release, as before #112, and every capability (#244).
# The browser package turns defaults off and names the releases and
# capabilities it ships (see openbim-ifc-wasm).
default = [
    "ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3",
    "ifcxml", "validate", "unreachable",
    "properties", "spatial", "classification", "material", "systems", "cost", "georef",
]
ifc2x3 = ["openbim-ifc/ifc2x3"]
ifc4 = ["openbim-ifc/ifc4"]
ifc4x1 = ["openbim-ifc/ifc4x1"]
ifc4x2 = ["openbim-ifc/ifc4x2"]
ifc4x3 = ["openbim-ifc/ifc4x3"]
# Capabilities (#244). Each adds to a browser build; an operation whose
# feature is off refuses with `feature-disabled` rather than vanishing.
# The ifcXML codec: the native layout, and the XSD layout of the bundled
# IFC4 / IFC4X3 releases.
ifcxml = ["openbim-ifc/ifcxml"]
# Schema validation, against the tables of the releases enabled above
# (#306).
validate = ["openbim-ifc/validate"]
# The viewer reachability lint: spatial containment plus representation
# contexts, with no geometry kernel. Classifies containers from the
# enabled releases' tables (#306).
unreachable = ["openbim-ifc/spatial", "openbim-ifc/geometry-select"]
# Domain views (#123), each an owned-snapshot read of one facade domain.
# Like the capabilities, each adds to a browser build, and an operation
# whose feature is off refuses with `feature-disabled`. Every domain crate
# links every release's schema table it reads.
# Property sets, quantities (type inheritance included) and exact units.
properties = ["openbim-ifc/properties"]
# The spatial containment tree.
spatial = ["openbim-ifc/spatial"]
# Classification references, inherited from the type object too.
classification = ["openbim-ifc/classification"]
# Material associations: layer, profile and constituent sets and usages.
material = ["openbim-ifc/material"]
# Distribution systems and their membership.
systems = ["openbim-ifc/systems"]
# Cost schedules, items and values.
cost = ["openbim-ifc/cost"]
# Map conversions and projected CRSs. The project length unit that scales
# them is resolved by the property domain, so this implies `properties`.
georef = ["properties", "openbim-ifc/georef"]

[lints]
workspace = true
