[package]
name = "ifc-schema"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC schema as data: entity table, supertype chain, attribute names."
readme = "README.md"

# NO geometry dependency. A schema is a lookup table.

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
status = "implemented"
# core | domain | geometry | facade | binding
group = "core"

[dependencies]
ahash.workspace = true
# EXPRESS extraction. Optional: the bundled tables decode into this crate's
# own types without it; only `express` (runtime .exp parsing) and
# `generation` (the artifact compiler) link it.
# Pinned here rather than through the workspace: ifc-step stays on its own
# openbim-step line, and only the build-time extractor needs 0.10's
# aggregation, INVERSE and UNIQUE extraction (#111).
openbim-step = { version = "=0.10.0", optional = true }
bincode = { version = "2.0.1", optional = true }
thiserror = { workspace = true, optional = true }

[features]
# Every bundled release. A default build keeps all five, exactly as before
# the per-release split; a size-sensitive build (browser WASM) turns
# defaults off and names the releases it ships.
default = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]
# One feature per bundled release (#112). Each ships that release's compiled
# table and its accessor (`ifc2x3()`, `ifc4()`, ...). A release whose feature
# is off is still a `SchemaVersion`: `for_version` refuses it with
# `NotBundled`, so a caller can tell "not compiled in" from an unknown token.
ifc2x3 = ["artifact"]
ifc4 = ["artifact"]
ifc4x1 = ["artifact"]
ifc4x2 = ["artifact"]
ifc4x3 = ["artifact"]
# The compiled-artifact decoder (`artifact_decode_schema`). Every release
# feature enables it; on its own it bundles no table.
artifact = ["dep:bincode", "dep:thiserror"]
# Compiles a user-supplied .exp into a committed artifact. Not part of
# default: the generator reads a normative ISO/buildingSMART source file that
# must never ship inside the published crate.
generation = ["express", "ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]
# `Schema::from_express` / `from_express_bytes`: parse EXPRESS source at run
# time through `openbim-step`. No `openbim-step` type is part of this crate's
# API either way.
express = ["dep:openbim-step"]

# Parses the fetched normative .exp files to compare them with the bundle.
[[test]]
name = "real_schemas"
required-features = ["express", "ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]

# These exercise every bundled table.
[[test]]
name = "subtypes"
required-features = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]

[[test]]
name = "structural_catalog_export"
required-features = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]

[[test]]
name = "direct_structural_catalog_export"
required-features = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]

[[test]]
name = "select_membership"
required-features = ["ifc4"]

[[bin]]
name = "ifc-schema-generate"
path = "tools/generate.rs"
required-features = ["generation"]

# Hash seeding differs by target (#34). Natively, ahash seeds from OS
# randomness (getrandom). getrandom 0.3 does not build for browser WASM
# (wasm32-unknown-unknown) without a global cfg flag every consumer would
# have to set, so there the seed is fixed at build time instead. These maps
# are internal lookup tables over data the caller already controls, so a
# per-build seed on the web costs no meaningful HashDoS resistance.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
ahash = { workspace = true, features = ["runtime-rng"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ahash = { workspace = true, features = ["compile-time-rng"] }

[lints]
workspace = true
