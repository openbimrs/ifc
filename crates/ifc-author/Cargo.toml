[package]
name = "ifc-author"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Schema-checked IFC authoring: construct entities by attribute name with arity and type validation."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "core"

[dependencies]
# Authoring is the write-side mirror of the read-side views: it needs the record
# store and the schema tables, and nothing else. NO codec dependency -- an
# authored model is serialized by whichever codec the caller chose.
ifc-model.workspace = true
# The caller passes the schema; production links no bundled table.
ifc-schema.workspace = true

[dev-dependencies]
# `Schema::from_express` for tests that parse EXPRESS fixtures or the
# fetched normative schemas; production builds never link the parser.
ifc-schema = { workspace = true, features = ["default", "express"] }
ifc-step.workspace = true

[lints]
workspace = true
