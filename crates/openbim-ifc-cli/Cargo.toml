[package]
name = "openbim-ifc-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
homepage = "https://openbimrs.github.io/ifc/guide/cli"
readme = "README.md"
description = "The openbim-ifc command: validate, convert and inspect IFC files (STEP and ifcXML) from a shell or CI."
keywords = ["ifc", "bim", "openbim", "cli", "validation"]
categories = ["command-line-utilities", "parser-implementations"]
# The binary is the product: `cargo install openbim-ifc-cli` installs it,
# and each `openbim-ifc-cli-v*` tag attaches prebuilt binaries to its GitHub
# release (release.yml, `cli-binaries`).

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "partial"
gaps = [329]
# core | domain | geometry | facade | binding | tool
group = "tool"

# `cargo binstall openbim-ifc-cli` takes the binary from the GitHub release
# instead of compiling it. The names are the ones release.yml uploads.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/openbim-ifc-v{ version }-{ target }.tar.gz"
bin-dir = "openbim-ifc-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/openbim-ifc-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/openbim-ifc-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "openbim-ifc"
path = "src/main.rs"

[dependencies]
# The facade only, never an `ifc-*` crate (package_architecture.rs pins
# this). Every bundled release, both codecs, and the domains the commands
# read; `geometry-select` is representation selection for `lint`, with no
# geometry kernel and no execution provider.
openbim-ifc = { workspace = true, features = [
    "step",
    "ifcxml",
    "schema",
    "validate",
    "spatial",
    "properties",
    "geometry-select",
] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }

[dev-dependencies]
# Parses the JSON and SARIF the binary writes; the binary writes its own.
serde_json = "1.0"

[lints]
workspace = true
