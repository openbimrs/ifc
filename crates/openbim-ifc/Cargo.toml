[package]
name = "openbim-ifc"
version = "0.31.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
readme = "README.md"
description = "Facade for the openBIM IFC crates: pick codecs and domains as features."
keywords = ["bim", "ifc", "openbim", "aec"]
categories = ["parser-implementations", "data-structures"]

# The lib target keeps the short name `ifc`: a facade should read as
# `use ifc::...` at the call site even though the published crate is
# `openbim-ifc` (the short name is taken on crates.io by an unrelated crate).

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "facade"

# One line per facade feature for the docs. A feature that enables exactly
# one crate is described by that crate's `description` and needs no line
# here; bundles and the two geometry sizes do. `xtask docs --check` fails
# when a feature has neither.
[package.metadata.openbim.features]
author = "Schema-checked authoring (`authoring`) with every bundled release (`schema`)."
authoring = "Schema-checked authoring (`ifc-author`) and the checked authoring batch (`apply_authoring`), against the releases the build names."
codecs = "Both codecs: STEP and ifcXML."
zip = "ifcZIP (`ifc::ifczip`, `ifc::ifczip::IfcZipCodec`): read an archive holding one STEP or ifcXML model within a decompression budget, and write one; Stored and Deflate only, through the pure-Rust `zip` and `flate2` (miniz_oxide) crates."
domains = "Every domain view, plus authoring and spatial traversal."
full = "Everything: codecs and ifcZIP, schema tables, every domain, catalogues, geometry and meshes, georeferencing and alignment."
geometry = "Representation selection plus lowering into the neutral geometry DAG."
geometry-wire = "Each product's Body as Axiolid's neutral geometry graph (`product_graphs`), exact and in world metres, encodable in Axiolid's versioned wire format (1.0; 1.1 where a station carries a seam-snapping window, 1.2 where a run's sections do, 1.3 where an offset run continues to a basis end the kernel measures) as JSON or CBOR (`ifc::geometry::wire`); a typed refusal per product. Computes nothing; adds the lowering and serde."
mesh = "Triangle meshes per product (`product_meshes`) through `ifc-geometry`'s reference compile backend: positions relative to each product's world placement, its surface colour (`colour`), a typed refusal per product. Opt-in; links an execution provider (ADR 0004, ADR 0012)."
colour = "The surface colour of each product's Body (`product_colours`): the item's styled item, its styled presentation layer, else its material's styled representation (layer, profile and constituent sets resolved per item), with the source and a typed refusal. Kernel-free."
geometry-select = "Representation selection only: contexts, plan/body choice, placements and units, with no geometry kernel."
material-templates = "Material views together with the property template catalogue."
property-catalog = "The PSD/QTO template catalogue (`ifc-template-catalog`), every edition embedded."
property-catalog-runtime = "The PSD/QTO template catalogue installed at runtime from pinned per-edition snapshot files; nothing embedded."
schema = "The schema API with every bundled release (IFC2X3, IFC4, IFC4X1, IFC4X2, IFC4X3)."
schema-api = "The schema API without a bundled release; implied by each release feature."
ifc2x3 = "The schema API with the bundled IFC2X3 TC1 table."
ifc4 = "The schema API with the bundled IFC4 ADD2 TC1 table."
ifc4x1 = "The schema API with the bundled IFC4X1 FINAL table."
ifc4x2 = "The schema API with the bundled IFC4X2 FINAL table."
ifc4x3 = "The schema API with the bundled IFC4X3 ADD2 table."
js-random = "Random `GlobalId`s (`new_guid`) on `wasm32-unknown-unknown` from the JavaScript host's `crypto.getRandomValues`; native targets always have them."
properties = "Property sets, quantities and unit resolution (`ifc-properties`); together with `geometry-select`, door and window operation geometry; together with `spatial`, element properties by spatial container."

[lib]
name = "ifc"

[dependencies]
# The model is unconditional: it is the thing every feature agrees on.
ifc-model.workspace = true

# --- serialization backends ---
ifc-step = { workspace = true, optional = true }
ifc-xml = { workspace = true, optional = true }
# ifcZIP (#450): the `zip` crate, the maintained pure-Rust ZIP reader and
# writer, with every default off and Deflate alone, through flate2's
# miniz_oxide backend (pure Rust, builds for wasm32). No encryption, no
# Deflate64, bzip2, LZMA or zstd: ifcZIP (CV-2x3-154) is PKZIP 2.04g, and
# an entry using any of them is refused by name. `flate2` is named only to
# choose its backend.
zip = { version = "9.0", optional = true, default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }

# --- schema (optional: needed for conformant ifcXML names and subtype queries) ---
ifc-schema = { workspace = true, optional = true }

# --- domain views ---
ifc-properties = { workspace = true, optional = true }
ifc-template-catalog = { workspace = true, optional = true }
ifc-cost = { workspace = true, optional = true }
ifc-schedule = { workspace = true, optional = true }
ifc-material = { workspace = true, optional = true }
ifc-classification = { workspace = true, optional = true }
ifc-approval = { workspace = true, optional = true }
ifc-control = { workspace = true, optional = true }
ifc-tabular = { workspace = true, optional = true }
ifc-constraint = { workspace = true, optional = true }
ifc-element-type = { workspace = true, optional = true }
ifc-occurrence = { workspace = true, optional = true }
ifc-structural = { workspace = true, optional = true }
ifc-resource = { workspace = true, optional = true }
ifc-systems = { workspace = true, optional = true }
ifc-style = { workspace = true, optional = true }
# ifc-validate, ifc-spatial, ifc-geometry and the property,
# classification, material, systems, cost and georef crates take their
# releases from the release features below (#306); the workspace turns
# their defaults off.
ifc-validate = { workspace = true, optional = true }
ifc-author = { workspace = true, optional = true }
ifc-spatial = { workspace = true, optional = true }
ifc-geometry = { workspace = true, optional = true, default-features = false }
# `transform` was the georef default before #306 turned defaults off.
ifc-georef = { workspace = true, optional = true, features = ["transform"] }
ifc-alignment = { workspace = true, optional = true }

# Random version-4 `GlobalId`s (`new_guid`, #463) from the operating
# system's generator. Natively it is always linked (ahash already links
# it). `wasm32-unknown-unknown` has no generator of its own: there it is
# linked only by `js-random`, which draws from the JavaScript host's
# `crypto.getRandomValues`; without it `new_guid` refuses with
# `GuidError::NoRandomSource`. getrandom 0.3.4 needs no `RUSTFLAGS` for that
# backend, only the feature.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.3.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", optional = true, features = ["wasm_js"] }

[features]
# Reading STEP is what almost everyone wants; nothing else is assumed.
# A domain in `default` would make every downstream build fat, which is the
# mistake `tests/thin_build.rs` exists to catch.
default = ["step"]

# --- codecs ---
step = ["dep:ifc-step"]
ifcxml = ["dep:ifc-xml"]
# ifcZIP (#450), reading whichever codecs the build names.
zip = ["dep:zip", "dep:flate2"]

# --- schema ---
# The schema API with every bundled release: the meaning `schema` always had.
schema = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]
# One bundled IFC release each (#112). Any of them provides the schema API;
# a release left out is refused by `schema::for_version` with
# `schema::NotBundled`. A size-sensitive build (browser WASM) names only the
# releases it ships. The domains the language bindings carry -- `validate`,
# `spatial`, `geometry-select`, `properties`, `classification`,
# `material`, `systems`, `cost` and `georef` -- link only the releases
# named here (#306): each release feature forwards to their crates, and
# `spatial` and `properties` refuse to compile without one. The other
# domain features still link every release through their crates.
ifc2x3 = ["schema-api", "ifc-schema/ifc2x3", "ifc-validate?/ifc2x3", "ifc-spatial?/ifc2x3", "ifc-geometry?/ifc2x3", "ifc-properties?/ifc2x3", "ifc-classification?/ifc2x3", "ifc-material?/ifc2x3", "ifc-systems?/ifc2x3", "ifc-cost?/ifc2x3", "ifc-georef?/ifc2x3"]
ifc4 = ["schema-api", "ifc-schema/ifc4", "ifc-validate?/ifc4", "ifc-spatial?/ifc4", "ifc-geometry?/ifc4", "ifc-properties?/ifc4", "ifc-classification?/ifc4", "ifc-material?/ifc4", "ifc-systems?/ifc4", "ifc-cost?/ifc4", "ifc-georef?/ifc4"]
ifc4x1 = ["schema-api", "ifc-schema/ifc4x1", "ifc-validate?/ifc4x1", "ifc-spatial?/ifc4x1", "ifc-geometry?/ifc4x1", "ifc-properties?/ifc4x1", "ifc-classification?/ifc4x1", "ifc-material?/ifc4x1", "ifc-systems?/ifc4x1", "ifc-cost?/ifc4x1", "ifc-georef?/ifc4x1"]
ifc4x2 = ["schema-api", "ifc-schema/ifc4x2", "ifc-validate?/ifc4x2", "ifc-spatial?/ifc4x2", "ifc-geometry?/ifc4x2", "ifc-properties?/ifc4x2", "ifc-classification?/ifc4x2", "ifc-material?/ifc4x2", "ifc-systems?/ifc4x2", "ifc-cost?/ifc4x2", "ifc-georef?/ifc4x2"]
ifc4x3 = ["schema-api", "ifc-schema/ifc4x3", "ifc-validate?/ifc4x3", "ifc-spatial?/ifc4x3", "ifc-geometry?/ifc4x3", "ifc-properties?/ifc4x3", "ifc-classification?/ifc4x3", "ifc-material?/ifc4x3", "ifc-systems?/ifc4x3", "ifc-cost?/ifc4x3", "ifc-georef?/ifc4x3"]
# The schema API (`Schema`, `SchemaVersion`, `schema::for_version`) without
# choosing a release; every release feature implies it.
schema-api = ["dep:ifc-schema", "ifc-template-catalog?/schema"]

# --- domains ---
# `ifc-properties` already links `ifc-schema`; naming it here lets the
# door- and window-operation joins read `OperationType` and
# `PartitioningType` by attribute name from the bound release's table instead
# of restating slot numbers. It adds no crate.
properties = ["dep:ifc-properties", "dep:ifc-schema"]
# The PSD/QTO catalog (ADR 0017), every edition embedded (1.4 MB).
property-catalog = ["dep:ifc-template-catalog", "ifc-template-catalog/embedded"]
# The same catalog supplied at runtime instead: nothing is embedded, and a
# host installs an edition's pinned snapshot bytes
# (`property_catalog::runtime::install`) before a `Pset_`/`Qto_` edit, which
# is refused with `PropertyEditFailure::CatalogNotLoaded` until then. With
# `property-catalog` too, the embedded catalog is used.
property-catalog-runtime = ["dep:ifc-template-catalog", "ifc-template-catalog/runtime"]
cost = ["dep:ifc-cost"]
schedule = ["dep:ifc-schedule"]
material = ["dep:ifc-material"]
material-templates = ["material", "property-catalog"]
classification = ["dep:ifc-classification"]
approval = ["dep:ifc-approval"]
control = ["dep:ifc-control"]
tabular = ["dep:ifc-tabular"]
constraint = ["dep:ifc-constraint"]
element-type = ["dep:ifc-element-type"]
occurrence = ["dep:ifc-occurrence"]
structural = ["dep:ifc-structural"]
resource = ["dep:ifc-resource"]
systems = ["dep:ifc-systems"]
style = ["dep:ifc-style"]
# Validation against the tables of the releases this build names: pair it
# with `schema` or a release feature, or `validate_declared` refuses every
# file with `UnbundledSchema`.
validate = ["dep:ifc-validate"]
# Authoring resolves slots from the schema tables, so it implies `schema`.
author = ["authoring", "schema"]
# The checked authoring batch (#330, `apply_authoring`) and `ifc-author`,
# without choosing a release: it checks against the tables of the releases
# a build names, as the language bindings do (#306).
authoring = ["dep:ifc-author", "schema-api"]
# Containment traversal reads the record graph, classifying spatial containers
# from the declared release's schema table. Needs `schema` or one of the
# release features `ifc2x3`, `ifc4`, `ifc4x3`: without a table nothing would
# classify as a container, so ifc-spatial refuses to compile instead.
spatial = ["dep:ifc-spatial"]
# Geometry comes in two sizes. `geometry` is the full bridge including
# lowering into the neutral DAG -- unchanged for existing consumers.
# `geometry-select` is representation selection only: contexts, plan/body
# choice, placements and units, linking no geometry kernel. A 2D drawing
# consumer wants the latter and should not pay for a CSG stack.
geometry = ["geometry-select", "ifc-geometry?/lowering"]
geometry-select = ["dep:ifc-geometry"]
# The neutral representation per product as a value (#367): `geometry`
# plus Axiolid's versioned wire format of the graph (JSON and CBOR,
# `ifc-geometry/wire`). Computes nothing; it adds serde, serde_json and
# ciborium.
geometry-wire = ["geometry", "ifc-geometry?/wire"]
# Meshes per product (#328): `geometry` plus `ifc-geometry`'s reference
# compile backend. Never default (ADR 0004): it links an execution provider.
mesh = ["geometry", "ifc-geometry?/compile-reference-backend", "colour"]
# The surface colour of each product's Body (#449, `product_colours`): the
# item's styled item, its styled presentation layer, else its material's
# styled representation. Joins `style`, `material` and `geometry-select`;
# kernel-free. `mesh` implies it, so every mesh carries its colour.
colour = ["geometry-select", "style", "material", "schema-api"]
georef = ["dep:ifc-georef"]
alignment = ["dep:ifc-alignment"]
# Random `GlobalId`s on `wasm32-unknown-unknown` through the JavaScript
# host's `crypto.getRandomValues` (browsers, Node 19 and later). Only a
# build that runs under JavaScript should name it, as the npm package does;
# it changes nothing on any other target.
js-random = ["dep:getrandom"]

# Convenience bundles.
codecs = ["step", "ifcxml"]
domains = [
    "element-type",
    "occurrence",
    "properties",
    "cost",
    "schedule",
    "material",
    "classification",
    "approval",
    "control",
    "tabular",
    "constraint",
    "structural",
    "resource",
    "systems",
    "style",
    "validate",
    "author",
    "spatial",
]
full = ["codecs", "zip", "schema", "domains", "property-catalog", "material-templates", "geometry", "geometry-wire", "mesh", "georef", "alignment", "js-random"]

[dev-dependencies]
# `Schema::from_express` for the documented authoring example; production
# builds never link the EXPRESS parser.
ifc-schema = { workspace = true, features = ["default", "express"] }
# Reading the wire envelope's `format` and `version` entries (#367).
serde_json = "1.0"
# Building the ifcZIP refusal fixtures (#450): empty, several entries,
# Stored entries whose headers a test then patches. `flate2` chooses the
# Deflate backend for builds that leave the `zip` feature out.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
