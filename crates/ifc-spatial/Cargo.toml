[package]
name = "ifc-spatial"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC spatial containment and objectified relationship traversal: project, site, building, storey, element."
readme = "README.md"

# Published on the docs site by `cargo run -p xtask -- docs`.
[package.metadata.openbim]
# implemented | partial | scaffold -- a judgement, never inferred from size.
# `gaps`: the open issues behind the status; a partial crate names one.
status = "implemented"
# core | domain | geometry | facade | binding
group = "domain"

[dependencies]
# Borrowed views over the record graph, per ADR 0003.
ifc-model.workspace = true
# Which entities are spatial containers is the declared release's subtype
# closure of IfcSpatialElement (IfcSpatialStructureElement in IFC2X3), which
# no name pattern captures: IFC4X3 adds IfcBridge, IfcRoad, IfcRailway,
# IfcMarineFacility and their parts. Slot positions stay constants; they are
# fixed across the releases and asserted in tests/slot_layout.rs. No default
# features: the release features below choose the tables (#306).
ifc-schema.workspace = true

[dev-dependencies]
# `Schema::from_express` for tests that parse EXPRESS fixtures or the
# fetched normative schemas; production builds never link the parser.
ifc-schema = { workspace = true, features = ["default", "express"] }
ifc-step.workspace = true

[features]
default = ["ifc2x3", "ifc4", "ifc4x1", "ifc4x2", "ifc4x3"]
# One feature per bundled IFC release, forwarded to `ifc-schema` (#306).
# Each links that release's schema table. A file declaring a release left
# out binds none: its containers are classified against every release the
# build bundles (`SpatialTree::release` is `None`). The default keeps all
# five, as before; a size-sensitive build (browser WASM) names only the
# releases it ships, and the `openbim-ifc` facade forwards its own release
# features here.
ifc2x3 = ["ifc-schema/ifc2x3"]
ifc4 = ["ifc-schema/ifc4"]
ifc4x1 = ["ifc-schema/ifc4x1"]
ifc4x2 = ["ifc-schema/ifc4x2"]
ifc4x3 = ["ifc-schema/ifc4x3"]

[lints]
workspace = true
