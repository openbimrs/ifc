[package]
name = "ifc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface: the reference consumer of the library."

[[bin]]
name = "ifc"
path = "src/main.rs"

[dependencies]
ifc-schema.workspace = true
ifc-step.workspace = true
ifc-model.workspace = true
ifc-geometry.workspace = true
ifc-properties.workspace = true
# The CLI is an APPLICATION, so it picks a concrete kernel. The workspace dep
# defaults to contract-only, so backends are opted INTO here explicitly. This is
# the one place in the workspace where binding to implementations is correct.
geom-kernel = { workspace = true, features = ["scalar", "simd"] }
geom-core.workspace = true
geom-mesh.workspace = true
