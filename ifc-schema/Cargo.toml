[package]
name = "ifc-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC schema as data: entity table, supertype chain, attribute names."

# NO geometry dependency. A schema is a lookup table.
[dependencies]
ahash.workspace = true
openbim-step.workspace = true
bincode = { version = "2.0.1", optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = ["ifc4"]
# Ships the compiled schema artifacts and their accessors: ifc2x3(), ifc4(),
# ifc4x3(), and for_version(). Named `ifc4` for compatibility with existing
# consumers; it now covers all three bundled validation targets.
ifc4 = ["dep:bincode", "dep:thiserror"]
# Compiles a user-supplied .exp into a committed artifact. Not part of
# default: the generator reads a normative ISO/buildingSMART source file that
# must never ship inside the published crate.
generation = ["ifc4"]

[[bin]]
name = "ifc-schema-generate"
path = "tools/generate.rs"
required-features = ["generation"]
