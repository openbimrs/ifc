name: Bug report
description: Report reproducible incorrect behaviour, a regression, or a build failure.
title: "[Bug]: "
labels: ["bug"]
projects: ["openbimrs/1"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not attach confidential models or standards material that you cannot redistribute.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest area; maintainers will correct it during triage.
      options:
        - Model
        - Codecs (STEP or ifcXML)
        - Validation and schema
        - Geometry
        - Domain projections
        - Documentation or integration
        - Unsure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and what user or downstream workflow is affected?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tested version
      description: Commit SHA, crate version, or exact branch.
      placeholder: "openbimrs/ifc@<sha>"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest redistributable code or IFC/STEP/XML input and exact command.
      placeholder: |
        command:
        input or link:
        actual output:
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant logs, backtraces, exporter information, or suspected regression range.
  - type: checkboxes
    id: rights
    attributes:
      label: Submission checks
      options:
        - label: I have the right to share every attached file and removed confidential project information.
          required: true
        - label: This report does not disclose a security vulnerability; those go through the private security channel.
          required: true
