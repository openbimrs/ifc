name: Papercut or ergonomics
description: Report small friction such as naming, visibility, a missing helper, or an awkward API.
title: "[Papercut]: "
labels: ["papercut"]
projects: ["openbimrs/1"]
assignees: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Model
        - Codecs (STEP or ifcXML)
        - Validation and schema
        - Geometry
        - Domain projections
        - Documentation or integration
        - Unsure
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What is awkward?
      description: What were you trying to do, and what workaround did you need?
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired improvement
      description: Describe the smallest change that would remove the friction.
  - type: textarea
    id: evidence
    attributes:
      label: Example
      description: Include a short code example or command when possible.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is narrow friction. If it requires a design decision or cross-crate API change, I will use the feature form instead.
          required: true
