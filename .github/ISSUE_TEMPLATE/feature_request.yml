name: Feature or enhancement
description: Propose a capability, API change, or material ergonomics improvement.
title: "[Feature]: "
labels: ["enhancement"]
projects: ["openbimrs/1"]
assignees: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest area; maintainers will correct it during triage.
      options:
        - Model
        - Codecs (STEP or ifcXML)
        - Validation and schema
        - Geometry
        - Domain projections
        - Documentation or integration
        - Unsure
    validations:
      required: true
  - type: input
    id: plan_task
    attributes:
      label: Existing plan task
      description: Optional stable task ID if this already appears in a PLAN.md file.
      placeholder: "For example: AUTHOR-EDIT"
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and use case
      description: What real user or downstream consumer needs this? Link consuming code when possible.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behaviour and acceptance criteria, not only an internal implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Sketch the API, behaviour, boundary, or design. It need not be final.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could this be solved downstream, in an existing crate, or with a current workaround?
  - type: dropdown
    id: size
    attributes:
      label: Estimated scope
      description: A best guess for triage; maintainers set authoritative Project metadata.
      options:
        - S — narrow and self-contained
        - M — one component with meaningful tests
        - L — public API or multiple modules
        - XL — cross-crate or needs design/decomposition
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary checks
      options:
        - label: I checked the capability matrix, roadmap, and existing issues for this request.
          required: true
        - label: I have not attached restricted standards material or confidential model data.
          required: true
