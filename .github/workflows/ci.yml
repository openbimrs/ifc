name: CI

# Each change is gated once per state that matters, not once per push:
# - pull_request: the change merged with its base, before it can land;
# - push to main or a maint/* branch: the exact commit a release tag will
#   point at. release.yml requires a passed `push` run on the tagged commit,
#   and that run is this one, so a release tag does not need a run of its own.
# Pushes of feature branches and of tags used to run the full gate again on
# commits a PR run or a branch run already covered.
on:
  push:
    branches: [main, "maint/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # scripts/gate.sh split into its sections, one parallel job each. The
  # sections are disjoint and together are the whole gate, so the union of
  # these jobs is exactly `scripts/gate.sh` with no argument.
  gate:
    name: Gate (${{ matrix.section }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        section: [lint, test, features, bindings]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        # The test section's debug build outgrew the hosted runner's disk
        # (the linker and the runner died with "No space left on device").
        # It needs none of the preinstalled SDKs removed here.
        if: matrix.section == 'test'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy, rustfmt
          # The gate builds the facade for browser WASM (#34).
          targets: wasm32-unknown-unknown
      - name: Cache Rust build
        # One cache per section: each builds a different feature and target
        # mix, so a shared cache would thrash. Only main saves, so a branch
        # or pull request can read the cache but never write into it.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.section }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The normative EXPRESS schemas are CC BY-ND 4.0: verbatim redistribution
      # is allowed, derivatives are not, so they are fetched rather than
      # vendored. Cached by content hash of the fetch script, which pins the
      # expected checksums.
      - name: Cache IFC EXPRESS schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: references/ifc-spec
          key: ifc-spec-${{ hashFiles('scripts/fetch-ifc-schemas.sh') }}
      - name: Set up Node
        # bindings runs the Node suites and the npm package check, whose
        # webpack comes from crates/openbim-ifc-wasm/tools and
        # whose headless Chrome is the one the hosted ubuntu image ships;
        # lint builds the docs site.
        if: matrix.section == 'bindings' || matrix.section == 'lint'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install wasm-bindgen CLI
        # Must equal both `wasm-bindgen` pins: crates/openbim-ifc-wasm/Cargo.toml
        # and the dev-dependency in crates/openbim-ifc/Cargo.toml; build-npm-pkg.sh
        # and check-wasm-seed.sh refuse a mismatch.
        if: matrix.section == 'bindings'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Set up Python
        # bindings builds and tests the wheel; lint links openbim-ifc-py for
        # clippy --all-targets, which needs libpython3.12 that the hosted
        # image no longer ships.
        if: matrix.section == 'bindings' || matrix.section == 'lint'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv and maturin
        # The gate builds the Python wheel with maturin and tests it in a uv
        # venv (crates/openbim-ifc-py/scripts/check-python.sh).
        if: matrix.section == 'bindings'
        run: python -m pip install "uv==0.11.19" "maturin==1.13.3"
      - name: Fetch IFC EXPRESS schemas
        run: scripts/fetch-ifc-schemas.sh
      - name: Install docs toolchain
        # Without node_modules gate.sh skips the docs build, so a dead link or
        # a broken diagram would only surface after merge, in the Pages job.
        if: matrix.section == 'lint'
        run: npm ci
      - name: Run gate section
        # IFC_SPEC_REQUIRED makes a missing schema fail instead of skip; the
        # fetch above already ran, so gate.sh does not need to repeat it.
        env:
          IFC_SPEC_SKIP_FETCH: "1"
        # No debug info in the test section's binaries: it is most of their
        # size, and a failure still prints its panic message.
        run: |
          if [ "${{ matrix.section }}" = test ]; then
            export CARGO_PROFILE_DEV_DEBUG=0
          fi
          scripts/gate.sh ${{ matrix.section }}

  # The one check that means "the whole gate passed", kept under the name
  # the single-job gate had. The Release workflow requires this workflow's
  # run on the commit it publishes to have succeeded.
  verdict:
    name: Standalone IFC gate
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate section to pass
        env:
          RESULT: ${{ needs.gate.result }}
        run: |
          [ "$RESULT" = success ] \
            || { echo "::error::gate sections did not all pass: $RESULT"; exit 1; }
