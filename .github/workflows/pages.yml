name: Pages

# A pull request builds and checks the site (the references, the playground
# in headless Chrome, the leakage check) without deploying it; a push to
# main deploys it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      # Each crate owns its changelog and the docs page is assembled from all
      # of them, so any one of them changing must rebuild the site.
      - 'crates/*/CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'xtask/**'
      # Binding surfaces and the tests the binding pages quote.
      - 'crates/*/tests/**'
      - 'crates/*/include/**'
      - 'crates/*/npm/package.json'
      - 'crates/*/pyproject.toml'
      - 'crates/openbim-ifc-py/python/**'
      # The .NET reference: the C# sources, its docfx config and the pinned
      # docfx tool (#385).
      - 'crates/openbim-ifc-dotnet/dotnet/OpenBim.Ifc/**'
      - 'crates/openbim-ifc-dotnet/docfx/**'
      - '.config/dotnet-tools.json'
      # Coverage manifests the coverage page counts.
      - 'crates/*/data/**'
      - '.github/workflows/pages.yml'
      # The playground's samples, viewer and the package build script (#331).
      - 'test/fixtures/**'
      - 'crates/*/examples/**'
      - 'crates/*/scripts/**'
      # The API reference is generated from doc comments, so a source-only
      # change still alters the published site.
      - '**/src/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      # Each crate owns its changelog and the docs page is assembled from all
      # of them, so any one of them changing must rebuild the site.
      - 'crates/*/CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'xtask/**'
      # Binding surfaces and the tests the binding pages quote.
      - 'crates/*/tests/**'
      - 'crates/*/include/**'
      - 'crates/*/npm/package.json'
      - 'crates/*/pyproject.toml'
      - 'crates/openbim-ifc-py/python/**'
      # The .NET reference: the C# sources, its docfx config and the pinned
      # docfx tool (#385).
      - 'crates/openbim-ifc-dotnet/dotnet/OpenBim.Ifc/**'
      - 'crates/openbim-ifc-dotnet/docfx/**'
      - '.config/dotnet-tools.json'
      # Coverage manifests the coverage page counts.
      - 'crates/*/data/**'
      - '.github/workflows/pages.yml'
      # The playground's samples, viewer and the package build script (#331).
      - 'test/fixtures/**'
      - 'crates/*/examples/**'
      - 'crates/*/scripts/**'
      # The API reference is generated from doc comments, so a source-only
      # change still alters the published site.
      - '**/src/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # docfx (pinned in .config/dotnet-tools.json) and the net8.0
          # assembly it documents (#385); as in dotnet.yml.
          dotnet-version: "8.0.x"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          # The npm package the TypeScript reference and the playground are
          # built from (#331).
          targets: wasm32-unknown-unknown
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-bindgen CLI
        # Must equal the `wasm-bindgen` pin in crates/openbim-ifc-wasm/Cargo.toml;
        # build-npm-pkg.sh refuses a mismatch.
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Install maturin and pdoc
        # pdoc renders the installed wheel; pandas lets it resolve the type
        # hints the package imports only for type checking. Pinned as in
        # crates/openbim-ifc-py/scripts/check-python.sh.
        run: python -m pip install "maturin==1.13.3" "pdoc==16.0.0" "pandas==3.0.6"
      - name: Cache IFC EXPRESS schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: references/ifc-spec
          key: ifc-spec-${{ hashFiles('scripts/fetch-ifc-schemas.sh') }}
      - name: Fetch IFC EXPRESS schemas
        run: scripts/fetch-ifc-schemas.sh
      - run: npm ci
      - name: Generated docs must match the source they are derived from
        run: cargo run --quiet -p xtask -- docs --check
      - run: npm run docs:build
      # rustdoc is generated from the same doc comments the gate already
      # builds with -D warnings, and nested under the VitePress output so it
      # ships in the one Pages artifact. It lives at /api/rustdoc/ rather than
      # /api/rust/ because VitePress emits the hand-written landing page as
      # api/rust.html, and a sibling api/rust/ directory would make the
      # /api/rust URL ambiguous on a static host.
      - name: Build the Rust API reference
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps
      - name: Nest rustdoc under the site at /api/rustdoc/
        run: |
          mkdir -p docs/.vitepress/dist/api/rustdoc
          cp -r target/doc/. docs/.vitepress/dist/api/rustdoc/
      # The JavaScript reference and the playground use the npm package
      # built from this commit, so the site documents and runs main, not the
      # last release (#331). Its suites ran in the gate.
      - name: Build the npm package
        env:
          IFC_NPM_BUILD_ONLY: "1"
        run: crates/openbim-ifc-wasm/scripts/build-npm-pkg.sh
      - name: Build the TypeScript API reference at /api/typedoc/
        # From the package's generated .d.ts; TypeDoc is pinned in
        # package.json and fails on any warning.
        run: npx --no-install typedoc --options docs/scripts/typedoc.json
      - name: Build the Python API reference at /api/pdoc/
        run: |
          maturin build --release --manifest-path crates/openbim-ifc-py/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl
          python -m pdoc --no-show-source --footer-text "openbim-ifc" -o docs/.vitepress/dist/api/pdoc openbim_ifc
          test -f docs/.vitepress/dist/api/pdoc/openbim_ifc.html
      - name: Build the .NET API reference at /api/dotnet/
        # docfx over the OpenBim.Ifc assembly's XML doc comments; fails on a
        # docfx warning or a member without a summary.
        env:
          IFC_DOTNET_REQUIRED: "1"
        run: crates/openbim-ifc-dotnet/scripts/build-api-docs.sh docs/.vitepress/dist/api/dotnet
      - name: Install the playground's module at /playground-files/
        run: node docs/scripts/playground.mjs crates/openbim-ifc-wasm/pkg docs/.vitepress/dist
      - name: Check the playground in headless Chrome
        # The hosted image ships Google Chrome; playwright-core drives it.
        run: node docs/scripts/check-playground.mjs docs/.vitepress/dist
      - name: Reject standards material from the published site
        run: python3 scripts/check-leakage.py docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1