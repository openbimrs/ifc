name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      # Each crate owns its changelog and the docs page is assembled from all
      # of them, so any one of them changing must rebuild the site.
      - '*/CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/assemble-changelog.py'
      - '.github/workflows/pages.yml'
      # The API reference is generated from doc comments, so a source-only
      # change still alters the published site.
      - '**/src/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
      - name: Cache IFC EXPRESS schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: references/ifc-spec
          key: ifc-spec-${{ hashFiles('scripts/fetch-ifc-schemas.sh') }}
      - name: Fetch IFC EXPRESS schemas
        run: scripts/fetch-ifc-schemas.sh
      - run: npm ci
      - name: Changelog page must match the canonical CHANGELOG.md
        run: python3 scripts/assemble-changelog.py --check
      - run: npm run docs:build
      # rustdoc is generated from the same doc comments the gate already
      # builds with -D warnings, and nested under the VitePress output so it
      # ships in the one Pages artifact. It lives at /api/rustdoc/ rather than
      # /api/rust/ because VitePress emits the hand-written landing page as
      # api/rust.html, and a sibling api/rust/ directory would make the
      # /api/rust URL ambiguous on a static host.
      - name: Build the Rust API reference
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps
      - name: Nest rustdoc under the site at /api/rustdoc/
        run: |
          mkdir -p docs/.vitepress/dist/api/rustdoc
          cp -r target/doc/. docs/.vitepress/dist/api/rustdoc/
      - name: Reject standards material from the published site
        run: python3 scripts/check-leakage.py docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1