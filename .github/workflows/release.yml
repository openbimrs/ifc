# Publish one crate family member to its registries when its release tag is
# pushed. `scripts/release-crate.py <crate> --publish` creates and pushes the
# tag; see docs/guide/contributing.md#releasing-a-crate.
#
#   <crate>-v<version>  ->  crates.io (unless publish = false)
#                            + npm   for openbim-ifc-wasm  (@openbim/ifc, with
#                                    its @openbim/ifc/mesh entry, #369)
#                            + PyPI  for openbim-ifc-py    (openbim-ifc)
#                            + NuGet for openbim-ifc-dotnet (OpenBim.Ifc, #327)
#                            + GitHub release archives for a crate with a
#                              CMakeLists.txt: openbim-ifc-capi (#41)
#                            + GitHub release binaries, Debian packages,
#                              SHA256SUMS, install.sh, install.ps1 and a
#                              Homebrew formula for a crate with a binary
#                              target: openbim-ifc-cli (#329, #376, #378)
#
# npm, PyPI, NuGet and crates.io use trusted publishing (OIDC). Each publish
# job runs in the environment named after its registry (`crates.io`,
# `npmjs.com`, `pypi.org`, `nuget.org`), and each registry trusts exactly this
# file name and that environment, so renaming either breaks publishing until
# the registry settings follow. NuGet's policy also names the nuget.org
# account the short-lived key is issued for: the `NUGET_USER` variable of the
# `nuget.org` environment. crates.io falls back to the CARGO_REGISTRY_TOKEN secret of
# the `crates.io` environment for crates not yet configured there, which
# includes every crate's first publish.
#
# Run it by hand (Actions -> Release -> Run workflow) with a tag name to
# rehearse a release: everything is built and tested, nothing is published.
# The gate itself is CI's: the plan job requires CI to have passed on the
# commit rather than running scripts/gate.sh a second time. Tags must be on
# main or on a maint/* branch (maintenance releases of an older line).
name: Release

on:
  push:
    tags:
      - "*-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. openbim-ifc-py-v0.1.0 (builds and tests only)"
        required: true

# Nothing here may be cancelled halfway: a crate published without its npm
# twin is a split release. The `v2` prefix retires the group of run
# 36585949055 (ifc-schema-v0.3.0), which GitHub left stuck in "waiting": its
# approval failed with HTTP 422, and it refused cancel, force-cancel and
# re-run, so every later run for that tag would have queued behind it.
concurrency:
  group: release-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan and gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read CI's verdict on the tagged commit
    outputs:
      crate: ${{ steps.plan.outputs.crate }}
      version: ${{ steps.plan.outputs.version }}
      crates_io: ${{ steps.plan.outputs.crates_io }}
      npm: ${{ steps.plan.outputs.npm }}
      pypi: ${{ steps.plan.outputs.pypi }}
      nuget: ${{ steps.plan.outputs.nuget }}
      native: ${{ steps.plan.outputs.native }}
      cli: ${{ steps.plan.outputs.cli }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to be on main or a maintenance branch
        # A tag on an unmerged branch would publish code nobody gated. A
        # maintenance release of an older line (ifc-xml 0.2.x after 0.3) is
        # cut from a `maint/<crate>-<line>` branch, which CI gates on push
        # like main; the commit-must-pass-CI check below applies to both.
        # Crates are trusted-publishing-only on crates.io, so this workflow
        # is the only way such a release can be published.
        # A rehearsal checks the dispatched ref the same way.
        run: |
          git fetch --quiet origin main '+refs/heads/maint/*:refs/remotes/origin/maint/*'
          for branch in origin/main $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/maint/); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "$GITHUB_REF_NAME is on $branch"; exit 0
            fi
          done
          echo "::error::$GITHUB_REF_NAME is not on main or a maint/* branch"; exit 1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
      - name: Resolve registries
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 scripts/release-crate.py "$TAG" --plan | tee -a "$GITHUB_OUTPUT"
      - name: Require CI to have passed on this commit
        # The full gate (scripts/gate.sh) already runs in CI on every push,
        # including this tag's, on this exact commit -- running it again here
        # cost 13 minutes and proved nothing new. Instead, wait for a CI run
        # of `.github/workflows/ci.yml` on this commit and require its
        # verdict. Only `push` runs count: they test the commit itself, while
        # a pull_request run tests a merge with its base. The commit is on
        # main or a maint/* branch (checked above), so CI ran that branch's
        # workflow and gate.sh.
        # Re-running a failed CI run and then this job picks up the new result.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion)"')"
            if grep -q ' completed success$' <<<"$runs"; then
              echo "CI passed on $GITHUB_SHA:"; echo "$runs"; exit 0
            fi
            if [ -n "$runs" ] && ! grep -qv ' completed ' <<<"$runs"; then
              echo "::error::CI did not pass on $GITHUB_SHA; re-run it, then re-run this workflow"
              echo "$runs"; exit 1
            fi
            echo "waiting for CI on $GITHUB_SHA: ${runs:-no run yet}"
            sleep 30
          done
          echo "::error::no finished CI run on $GITHUB_SHA after 60 minutes"; exit 1

  crates-io:
    name: Publish to crates.io
    needs: plan
    if: needs.plan.outputs.crates_io == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/${{ needs.plan.outputs.crate }}/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
      - name: Authenticate with crates.io (trusted publishing)
        # A short-lived token, revoked when the job ends. crates.io issues
        # it when ANY crate trusts this workflow and the `release`
        # environment, but it only works for those crates, so a token can
        # exist and still be refused for the crate being released.
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        # --publish-here skips a version that is already live, so the
        # fallback retry with the long-lived secret is safe: it can only
        # publish what the trusted-publishing attempt did not. The fallback
        # goes away when CARGO_REGISTRY_TOKEN is deleted.
        env:
          CRATE: ${{ needs.plan.outputs.crate }}
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$OIDC_TOKEN" ] && CARGO_REGISTRY_TOKEN="$OIDC_TOKEN" \
              python3 scripts/release-crate.py "$CRATE" --publish-here; then
            exit 0
          fi
          if [ -z "$FALLBACK_TOKEN" ]; then
            echo "::error::trusted publishing failed for $CRATE and no CARGO_REGISTRY_TOKEN fallback is set"
            exit 1
          fi
          echo "::warning::$CRATE is not publishable via crates.io trusted publishing; used CARGO_REGISTRY_TOKEN"
          CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN" python3 scripts/release-crate.py "$CRATE" --publish-here

  npm:
    name: Publish to npm
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npmjs.com
      url: https://www.npmjs.com/package/@openbim/ifc/v/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build
      - name: Install npm with trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install --global npm@^11.5.1 && npm --version
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Build and test the package
        # Both entries from this tag: the default (`@openbim/ifc`) and the
        # mesh entry (`@openbim/ifc/mesh`, `mesh/`, #369), each bound for
        # Node, bundlers and the web, then checked from the packed tarball.
        # One `npm publish` below ships both.
        run: crates/openbim-ifc-wasm/scripts/build-npm-pkg.sh
      - name: Rehearse publish
        # npm 11 refuses even a dry run over a live version, so rehearsing
        # an already-published tag packs the tarball instead.
        if: github.event_name != 'push'
        working-directory: crates/openbim-ifc-wasm/pkg
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm; packing instead"
            npm pack --dry-run
          else
            npm publish --dry-run --access public
          fi
      - name: Publish
        if: github.event_name == 'push'
        working-directory: crates/openbim-ifc-wasm/pkg
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm"
          else
            npm publish --access public
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.pypi == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: macos-universal2, os: macos-15, target: universal2-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.13.3"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist --manifest-path crates/openbim-ifc-py/Cargo.toml
      - name: Test the built wheel
        # Installed outside the source tree, so the suites import the wheel.
        shell: bash
        run: |
          python -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/crates/openbim-ifc-py/tests/python" -t "$GITHUB_WORKSPACE/crates/openbim-ifc-py/tests/python"
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: plan
    if: needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.13.3"
          command: sdist
          args: --out dist --manifest-path crates/openbim-ifc-py/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [plan, wheels, sdist]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi.org
      url: https://pypi.org/project/openbim-ifc/${{ needs.plan.outputs.version }}/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -la dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # The C ABI ships as prebuilt archives, not through a registry (#41): per
  # platform, the `cmake --install` tree of crates/openbim-ifc-capi -- header,
  # static and shared library, the openbim_ifc CMake package and, outside
  # Windows, the pkg-config files (#325). Each is built and then proven by
  # check-cmake.py, which unpacks the archive in a fresh place and runs the C
  # and C++ smoke test against it through CMake and pkg-config, shared and
  # static. Built cold, without a cache, because the archives ship.
  #
  # The NuGet package (#327) carries the same shared libraries, so a
  # openbim-ifc-dotnet tag builds and proves the archives here too and the
  # package takes its libraries from them; only a openbim-ifc-capi tag
  # attaches them to its GitHub release.
  native-archives:
    name: C library (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.native == 'true' || needs.plan.outputs.nuget == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest hosted images, so the libraries ask the least of a
          # consumer's glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Provide pkg-config
        # check-cmake.py also builds the smoke test from the pkg-config files
        # (#325) and fails without pkg-config; Windows is CMake-only.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          command -v pkg-config && exit 0
          if command -v brew; then brew install pkgconf; else sudo apt-get update && sudo apt-get install -y pkg-config; fi
      - name: Build, pack and test the archive
        run: python crates/openbim-ifc-capi/scripts/check-cmake.py --archive-dir dist
      - name: Require the archive this runner was meant to build
        # Named after the C ABI crate's version, which is the tag's on a
        # openbim-ifc-capi tag (the plan checked) and its own on any other.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/openbim-ifc-capi/Cargo.toml | head -1)"
          stem="openbim-ifc-capi-v$version-$TARGET"
          ls "dist/$stem.tar.gz" 2>/dev/null || ls "dist/$stem.zip"
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The openbim-ifc command (#329) ships as one prebuilt binary per platform
  # on the openbim-ifc-cli GitHub release, beside its crates.io package.
  # Linux binaries are static (musl), so they run on any distribution. Each
  # is built cold, smoke-tested, packed by package.py into the archive the
  # installers download, and installed from a local mirror of that archive:
  # through install.sh on Linux and macOS (check-install.sh), through
  # install.ps1 on Windows (check-install.ps1, #378). On Linux the same
  # binary is also packed as a .deb, inspected, installed with dpkg, run and
  # removed (check-deb.sh, #376). A rehearsal runs all of it.
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
          targets: ${{ matrix.target }}, wasm32-unknown-unknown
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p openbim-ifc-cli --target "$TARGET"
      - name: Smoke-test the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/openbim-ifc"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" validate test/fixtures/synthetic-bindings/binding_geometry.ifc
          "$bin" info test/fixtures/synthetic-properties/synthetic_properties.ifc
      - name: Pack
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/openbim-ifc"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          python crates/openbim-ifc-cli/scripts/package.py archive --target "$TARGET" --binary "$bin" --out dist
      - name: Install through install.sh
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: crates/openbim-ifc-cli/scripts/check-install.sh "target/$TARGET/release/openbim-ifc"
      - name: Install through install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: crates/openbim-ifc-cli/scripts/check-install.ps1 -Binary "target/$env:TARGET/release/openbim-ifc.exe"
      - name: Pack, inspect, install and remove the .deb
        # --out dist: the .deb this checks is the one uploaded below.
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: crates/openbim-ifc-cli/scripts/check-deb.sh --install --out dist "target/$TARGET/release/openbim-ifc"
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Everything the openbim-ifc-cli release attaches, assembled and checked
  # before anything is published, so a rehearsal proves it too: one archive
  # per cli-binaries entry and one .deb per Linux entry, their SHA256SUMS,
  # the Homebrew formula filled from it, and both install scripts.
  # cli-assets uploads exactly this set.
  cli-assemble:
    name: Assemble the CLI release assets
    needs: [plan, cli-binaries]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Checksum the archives and packages and write the Homebrew formula
        # Six archives and two .deb files. The formula takes each platform's
        # checksum from SHA256SUMS and refuses a missing one.
        run: |
          python3 crates/openbim-ifc-cli/scripts/package.py checksums dist --expect 8
          python3 crates/openbim-ifc-cli/scripts/package.py formula --sums dist/SHA256SUMS --out dist/openbim-ifc.rb
          cp crates/openbim-ifc-cli/install.sh crates/openbim-ifc-cli/install.ps1 dist/
          ls -l dist
      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Not cli-*: the download above must never pick it up on a re-run.
          name: release-assets-cli
          path: dist/*
          if-no-files-found: error

  # The NuGet package (#327): C# over the C ABI, with the shared library of
  # every native-archives runner under runtimes/<rid>/native/. Packed once,
  # then installed from a local feed into a fresh project and tested on each
  # runtime it ships, before anything is published.
  nuget-pack:
    name: Pack OpenBim.Ifc
    needs: [plan, native-archives]
    if: needs.plan.outputs.nuget == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Download the C library archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: archives
          merge-multiple: true
      - name: Pack with every runtime's library
        run: >-
          python3 crates/openbim-ifc-dotnet/scripts/check-dotnet.py
          --archives archives --rids all --out nupkg --work "$RUNNER_TEMP/dotnet"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  nuget-test:
    name: Test OpenBim.Ifc (${{ matrix.rid }})
    needs: [plan, nuget-pack]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-15 }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: feed
      - name: Test the packed package from a fresh project
        # On windows-latest also on .NET Framework 4.8.
        shell: bash
        run: python crates/openbim-ifc-dotnet/scripts/check-dotnet.py --test-only --feed feed --work "$RUNNER_TEMP/dotnet"

  nuget:
    name: Publish to NuGet
    needs: [plan, nuget-pack, nuget-test]
    if: github.event_name == 'push' && needs.plan.outputs.nuget == 'true'
    runs-on: ubuntu-latest
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/OpenBim.Ifc/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: nupkg
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Authenticate with NuGet (trusted publishing)
        # Exchanges this job's OIDC token for an API key valid one hour.
        # NUGET_USER is a variable of the `nuget.org` environment: the
        # nuget.org account the trusted-publishing policy belongs to.
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        # --skip-duplicate: a re-run after a partial failure finishes the
        # release instead of failing on a version that is already live.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  github-release:
    # Every tag gets a GitHub release, whatever registry it went to: the
    # crate's changelog section for this version plus links to where it was
    # published. Runs once every publish job of the tag has succeeded or was
    # skipped for this crate. Only the facade is marked Latest: with one tag
    # stream per crate, "Latest" would otherwise follow whichever crate was
    # released last.
    name: GitHub release
    needs: [plan, crates-io, npm, pypi, nuget-pack, nuget-test, nuget, native-archives, cli-binaries, cli-assemble]
    if: >-
      always() && github.event_name == 'push' && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release from the changelog section
        # An existing release (a re-run) keeps its notes.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CRATE: ${{ needs.plan.outputs.crate }}
          VERSION: ${{ needs.plan.outputs.version }}
          CRATES_IO: ${{ needs.plan.outputs.crates_io }}
          NPM: ${{ needs.plan.outputs.npm }}
          PYPI: ${{ needs.plan.outputs.pypi }}
          NUGET: ${{ needs.plan.outputs.nuget }}
          NATIVE: ${{ needs.plan.outputs.native }}
          CLI: ${{ needs.plan.outputs.cli }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 0
          fi
          # Match the [package] name only: a [[bin]] may share it (openbim-ifc-cli).
          manifest="$(for m in crates/*/Cargo.toml; do
            awk -v c="$CRATE" '/^\[/ { pkg = ($0 == "[package]") } pkg && $0 == "name = \"" c "\"" { found = 1 } END { exit !found }' "$m" && echo "$m"
          done)"
          [ "$(printf '%s\n' "$manifest" | grep -c .)" = 1 ] || { echo "::error::expected one manifest for $CRATE, got: $manifest"; exit 1; }
          changelog="$(dirname "$manifest")/CHANGELOG.md"
          # The section ends at the next version heading or the link references.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' "$changelog" > notes.md
          [ -n "$(tr -d '[:space:]' < notes.md)" ] || { echo "::error::no $VERSION section in $changelog"; exit 1; }
          {
            echo
            [ "$CRATES_IO" = true ] && echo "**crates.io:** https://crates.io/crates/$CRATE/$VERSION"
            [ "$NPM" = true ] && echo "**npm:** https://www.npmjs.com/package/@openbim/ifc/v/$VERSION"
            [ "$PYPI" = true ] && echo "**PyPI:** https://pypi.org/project/openbim-ifc/$VERSION/"
            [ "$NUGET" = true ] && echo "**NuGet:** https://www.nuget.org/packages/OpenBim.Ifc/$VERSION"
            [ "$NATIVE" = true ] && echo "**C library:** prebuilt CMake archives and \`SHA256SUMS\` are attached below."
            [ "$CLI" = true ] && echo "**Binaries:** Linux (static), macOS and Windows (x64, Arm64) archives, Debian packages (amd64, arm64), \`SHA256SUMS\` and the Homebrew formula are attached below. Install on Linux or macOS: \`curl -fsSL https://raw.githubusercontent.com/openbimrs/ifc/$TAG/crates/openbim-ifc-cli/install.sh | sh -s -- --version $VERSION\`; on Windows: \`& ([scriptblock]::Create((irm https://raw.githubusercontent.com/openbimrs/ifc/$TAG/crates/openbim-ifc-cli/install.ps1))) -Version $VERSION\`; on Debian or Ubuntu: \`sudo apt install ./openbim-ifc_${VERSION}_amd64.deb\`"
            true
          } >> notes.md
          latest=false
          [ "$CRATE" = openbim-ifc ] && latest=true
          gh release create "$TAG" --verify-tag --title "$CRATE $VERSION" \
            --notes-file notes.md --latest="$latest"

  native-assets:
    name: Attach C library archives to the GitHub release
    needs: [plan, native-archives, github-release]
    # always(): github-release depends on publish jobs that a C library tag
    # skips, and without it GitHub skips every job downstream of a skip.
    if: >-
      always() && github.event_name == 'push' && needs.plan.outputs.native == 'true'
      && needs.native-archives.result == 'success' && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Checksum the archives
        working-directory: dist
        run: |
          # One archive per native-archives matrix entry.
          [ "$(ls | wc -l)" -eq 6 ] || { echo "::error::expected 6 archives:"; ls; exit 1; }
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attach the archives
        # --clobber replaces assets a failed run left half-uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  cli-assets:
    name: Attach CLI binaries to the GitHub release
    needs: [plan, cli-assemble, github-release]
    # always(): as for native-assets, github-release depends on jobs this
    # tag skips.
    if: >-
      always() && github.event_name == 'push' && needs.plan.outputs.cli == 'true'
      && needs.cli-assemble.result == 'success' && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the assembled assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-cli
          path: dist
      - name: Attach the archives
        # --clobber replaces assets a failed run left half-uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Update the Homebrew tap
        # Runs only once the maintainer has created openbimrs/homebrew-tap
        # and stored a token that may push to it as HOMEBREW_TAP_TOKEN
        # (docs/guide/cli.md#homebrew). Without it the formula is still on
        # the release, and this step says so instead of failing.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; openbim-ifc.rb is attached to the release but no tap was updated"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/openbimrs/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/openbim-ifc.rb tap/Formula/openbim-ifc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/openbim-ifc.rb
          if git diff --cached --quiet; then
            echo "the tap already has openbim-ifc $VERSION"; exit 0
          fi
          git commit -m "openbim-ifc $VERSION"
          git push origin HEAD
