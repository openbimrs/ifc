# Build for the host CPU (bbv-dev: Intel Xeon w7-3565X, AVX-512 + AMX). Same
# rationale as ../vendor/solibri: don't leave modern hardware on the table.
# Portable binary: override with RUSTFLAGS="-C target-cpu=x86-64-v3".
[build]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
