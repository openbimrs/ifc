[package]
name = "ifc-geometry"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC semantic views lowered into the format-neutral geometry DAG."

[features]
# Lowering into the neutral DAG is what most consumers want, so it stays the
# default: a plain `ifc-geometry = "0.1"` keeps working unchanged.
#
# Turning it off leaves the IFC-side views -- representation contexts, plan and
# body selection, profiles, curves, surfaces, solids, units, placements -- which
# read `ifc-model` slots and link no geometry kernel at all. That is the build a
# 2D drawing consumer wants; `tests/kernel_free_build.rs` holds the line.
default = ["lowering"]
lowering = [
    "dep:ifc-alignment",
    "dep:axiolid-core",
    "dep:axiolid-curve",
    "dep:axiolid-mesh",
    "dep:axiolid-model",
    "dep:axiolid-topology",
    "dep:axiolid-primitive",
    "dep:axiolid-profile",
    "dep:axiolid-surface",
]

# Mesh compilation. OFF by default: it selects an execution provider and a
# memory budget, which are application policy, not properties of the file.
# ADR 0004 admits this narrowly -- opt-in only, never in the default build.
# The compilation seam: contracts only, no engine. A caller who brings
# CGAL, OCCT, or their own kernel enables this alone and links none of the
# reference implementation.
compile = [
    "lowering",
    "dep:axiolid-contracts",
    "dep:axiolid-mesh-compile-contract",
    "dep:axiolid-curve-evaluate-contract",
]

# The reference backend, kept separate so it is a choice rather than a
# tax. Enabling `compile` alone leaves `compile_product_mesh_with` usable
# with a caller-supplied backend; this adds `default_backend` and the
# convenience `compile_product_mesh` that wraps it.
compile-reference-backend = [
    "compile",
    "dep:axiolid-mesh-compile",
    "dep:axiolid-mesh-boolean-boolmesh",
    "dep:axiolid-construct",
]

[dependencies]
ifc-model.workspace = true
ifc-schema.workspace = true
# ADR 0003 (amended 2026-09-15): a bridge may depend on a bridge. Optional and
# reached only through `lowering`, because `ifc-alignment` links the kernel
# unconditionally and the kernel-free column must stay kernel-free.
ifc-alignment = { workspace = true, optional = true }
thiserror.workspace = true

# Format-neutral representation crates only. Operation-provider selection
# belongs to the app.
# Optional so a consumer that only selects and reads representations links no
# geometry kernel; see the `lowering` feature.
axiolid-core = { workspace = true, optional = true }
axiolid-curve = { workspace = true, optional = true }
axiolid-mesh = { workspace = true, optional = true }
axiolid-model = { workspace = true, optional = true }
axiolid-topology = { workspace = true, optional = true }
axiolid-primitive = { workspace = true, optional = true }
axiolid-profile = { workspace = true, optional = true }
axiolid-surface = { workspace = true, optional = true }

# Execution provider. Reachable only through the opt-in `compile` feature.
axiolid-contracts = { workspace = true, optional = true }
axiolid-mesh-compile = { workspace = true, optional = true }
axiolid-mesh-compile-contract = { workspace = true, optional = true }
axiolid-mesh-boolean-boolmesh = { workspace = true, optional = true }
# Version floor only (>= 0.3.1): the reference compiler above depends on it,
# and 0.3.0 cuts offset half-space clips in the wrong place and winds
# downward extrusions inside-out. Nothing here imports it.
axiolid-construct = { workspace = true, optional = true }
# The CurveEvaluator capability, not an engine: names evaluation so a caller
# can inject one. Opt-in with the other providers, never in the default build.
axiolid-curve-evaluate-contract = { workspace = true, optional = true }

[dev-dependencies]
# Tests only: a concrete evaluator to inject, proving the seam works.
# The library names the capability and links no implementation.
axiolid-evaluate.workspace = true
ifc-step.workspace = true
axiolid-reference.workspace = true
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }

[lints]
workspace = true
