[package]
name = "ifc-geometry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC semantic views lowered into the format-neutral geometry DAG."

[features]
# Lowering into the neutral DAG is what most consumers want, so it stays the
# default: a plain `ifc-geometry = "0.1"` keeps working unchanged.
#
# Turning it off leaves the IFC-side views -- representation contexts, plan and
# body selection, profiles, curves, surfaces, solids, units, placements -- which
# read `ifc-model` slots and link no geometry kernel at all. That is the build a
# 2D drawing consumer wants; `tests/kernel_free_build.rs` holds the line.
default = ["lowering"]
lowering = [
    "dep:axiolid-core",
    "dep:axiolid-curve",
    "dep:axiolid-mesh",
    "dep:axiolid-model",
    "dep:axiolid-topology",
    "dep:axiolid-primitive",
    "dep:axiolid-profile",
    "dep:axiolid-surface",
]

[dependencies]
ifc-model.workspace = true
ifc-schema.workspace = true
thiserror.workspace = true

# Format-neutral representation crates only. Operation-provider selection
# belongs to the app.
# Optional so a consumer that only selects and reads representations links no
# geometry kernel; see the `lowering` feature.
axiolid-core = { workspace = true, optional = true }
axiolid-curve = { workspace = true, optional = true }
axiolid-mesh = { workspace = true, optional = true }
axiolid-model = { workspace = true, optional = true }
axiolid-topology = { workspace = true, optional = true }
axiolid-primitive = { workspace = true, optional = true }
axiolid-profile = { workspace = true, optional = true }
axiolid-surface = { workspace = true, optional = true }

[dev-dependencies]
ifc-step.workspace = true
axiolid-scalar.workspace = true
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
