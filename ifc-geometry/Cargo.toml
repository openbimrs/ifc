[package]
name = "ifc-geometry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "IFC semantic views lowered into the format-neutral geometry DAG."

[dependencies]
ifc-model.workspace = true
ifc-schema.workspace = true
axiolid-core.workspace = true
axiolid-curve.workspace = true
axiolid-model.workspace = true
axiolid-topology.workspace = true
axiolid-primitive.workspace = true
axiolid-profile.workspace = true
thiserror.workspace = true
# Representation crates only. Operation-provider selection belongs to the app.

[dev-dependencies]
ifc-step.workspace = true
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
