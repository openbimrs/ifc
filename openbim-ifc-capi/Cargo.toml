[package]
name = "openbim-ifc-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ifc"
description = "Versioned, memory-safe C ABI for openbim-ifc: read, edit and write IFC STEP files from C and C++."
keywords = ["ifc", "bim", "ffi", "c-abi", "openbim"]
categories = ["api-bindings", "parser-implementations"]

[lib]
# staticlib/cdylib are the C artifacts; rlib lets the Rust boundary tests
# call the exports directly.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# ADR 0013: bindings reach IFC through the facade only, via the shared core.
openbim-ifc-binding-core.workspace = true
# Opt-in pure-Rust allocator, see the `rusty_alloc` feature (#49). Pinned
# exactly, core crate included: an allocator is unsafe code under every
# allocation, and this one is young (its 0.3.x line had use-after-frees), so
# an upgrade is a reviewed, measured change, never a silent `cargo update`.
rusty_alloc-api = { version = "=2.2.1", optional = true }
rusty_alloc = { version = "=2.2.1", optional = true, default-features = false }

[features]
default = []
# Route the library's Rust allocations through rusty_alloc: reading STEP
# into a model takes 18-35% less CPU time on seven real IFC files, at 1-7%
# less peak memory (measured in #49). The host's own `malloc` is untouched.
# Do not enable it when this crate is used as an rlib by a Rust program
# that sets its own global allocator: a program may have only one.
rusty_alloc = ["dep:rusty_alloc-api", "dep:rusty_alloc"]

[dev-dependencies]
# Regenerates the header in-memory to prove the committed one is current.
cbindgen = { version = "=0.29.4", default-features = false }

[lints]
workspace = true
