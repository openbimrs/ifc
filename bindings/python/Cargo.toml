[package]
name = "nehirde-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings (pyo3/maturin). Deps intentionally not yet wired — see lib.rs."

[lib]
# `cdylib` is what Python loads; `rlib` keeps it testable from Rust.
crate-type = ["cdylib", "rlib"]

[dependencies]
ifc-schema.workspace = true
ifc-step.workspace = true
ifc-model.workspace = true
ifc-properties.workspace = true
geom-kernel = { workspace = true, features = ["scalar", "simd"] }
# pyo3 is NOT added yet: it needs Python dev headers present at build time and
# would break `cargo build --workspace` on a machine without them. Added in the
# same commit that wires the first real binding. See lib.rs.
