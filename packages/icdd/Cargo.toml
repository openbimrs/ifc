[package]
name = "icdd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/openbimrs/openbim"
readme = "README.md"
description = "ISO 21597 ICDD (Information Container for linked Document Delivery). Alias crate: re-exports `openbim-icdd` under its standard's common name."
keywords = ["bim", "openbim", "aec"]
categories = ["parser-implementations", "data-structures"]

[dependencies]
# Pinned with '=' on purpose. A caret range would let this alias drift a
# version behind the canonical crate, and a dependency graph holding both
# would then carry two distinct, non-unifiable copies of the same types.
openbim-icdd = { path = "../openbim-icdd", version = "=0.1.0" }
