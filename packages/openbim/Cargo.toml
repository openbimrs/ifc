[package]
name = "openbim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/openbimrs/openbim"
readme = "README.md"
description = "Facade for the openBIM standards: enable only the standards you need."
keywords = ["bim", "openbim", "ifc", "bcf", "ids"]
categories = ["parser-implementations", "data-structures"]

[dependencies]
openbim-core.workspace = true
# Every standard is optional. Enabling one pulls exactly its crate and nothing
# else -- that is the whole point of keeping them as separate packages rather
# than modules behind features of one crate (see docs/adr/0015).
openbim-dt = { workspace = true, optional = true }
openbim-ids = { workspace = true, optional = true }
openbim-bcf = { workspace = true, optional = true }
openbim-icdd = { workspace = true, optional = true }
openbim-idm = { workspace = true, optional = true }
openbim-loin = { workspace = true, optional = true }

[features]
# No standard is on by default: depending on `openbim` must never cost more
# than the shared vocabulary.
default = []
dt = ["dep:openbim-dt"]
ids = ["dep:openbim-ids"]
bcf = ["dep:openbim-bcf"]
icdd = ["dep:openbim-icdd"]
idm = ["dep:openbim-idm"]
# LOIN's schema imports ISO 23387, so `loin` implies `dt`.
loin = ["dep:openbim-loin", "dt"]
full = ["dt", "ids", "bcf", "icdd", "idm", "loin"]
