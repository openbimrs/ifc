[package]
name = "ifc-geometry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The ONLY bridge between IFC and geometry. Depends on the kernel CONTRACT, never on a backend."

[dependencies]
ifc-model.workspace = true
ifc-schema.workspace = true
geom-core.workspace = true
geom-mesh.workspace = true
# CONTRACT ONLY — default-features = false excludes every backend
# implementation, so this crate cannot accidentally bind to one. Enforced by
# tests/no_backend_dependency.rs. See docs/adr/0001.
geom-kernel = { workspace = true, default-features = false }
